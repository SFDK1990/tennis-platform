<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tennis Platform</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #0f1f3d; color: #fff; }
    main { text-align: center; padding: 24px; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px;
        background: #d7f35c; color: #0f1f3d; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Tennis Platform</h1>
    <p>Clases de tenis: reserva y gestiona tus clases.</p>
    <a href="/app">Entrar en la aplicación</a>
  </main>
  <script>
    // The app lives on its own subdomain: app.<this domain>.
    document.querySelector("a").href = location.protocol + "//app." + location.hostname.replace(/^www\./, "");
  </script>
</body>
</html>
