name: tennis-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: tennis-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tennis_platform}
      POSTGRES_USER: ${DB_USER:-tennis_platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tennis_platform}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tennis_platform} -d ${DB_NAME:-tennis_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outgoing email in development and shows it in a web inbox, so the
  # verification and password-reset flows can be exercised without a real mail provider.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tennis-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    container_name: tennis-backend
    # Liquibase runs at startup, so the database must already accept connections.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tennis_platform}
      DB_USER: ${DB_USER:-tennis_platform}
      DB_PASSWORD: ${DB_PASSWORD:-tennis_platform}
      SERVER_PORT: 8080
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32-bytes-min}
      # Blank by default: no teacher is created unless these are set in .env.
      TEACHER_EMAIL: ${TEACHER_EMAIL:-}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-}
      TEACHER_DISPLAY_NAME: ${TEACHER_DISPLAY_NAME:-}
      TEACHER_TIMEZONE: ${TEACHER_TIMEZONE:-Europe/Madrid}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The E2E suite raises it: all of it comes from one IP (25-fase14-analisis-cobertura-e2e.md).
      TENNIS_IDENTITY_AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
