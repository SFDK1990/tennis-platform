# Production profile. No defaults on purpose: a missing environment variable must fail
# startup rather than silently fall back to an insecure or wrong value.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

tennis:
  identity:
    # No default: a missing secret must stop the application, never fall back to a known one.
    jwt-secret: ${JWT_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.tennisplatform: INFO
