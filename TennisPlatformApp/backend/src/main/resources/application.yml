spring:
  application:
    name: tennis-platform-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

tennis:
  identity:
    jwt-issuer: tennis-platform
    # Short-lived access token, long-lived rotating refresh token.
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    email-verification-ttl: 24h
    # Deliberately shorter: a reset link is a live key to the account.
    password-reset-ttl: 1h
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    mail-from: ${MAIL_FROM:no-reply@tennis-platform.local}
    # The first administrator, created at startup like the teacher. Blank means none.
    admin-bootstrap-email: ${ADMIN_EMAIL:}
    admin-bootstrap-password: ${ADMIN_PASSWORD:}
  teacher:
    # The single teacher is created at startup from these values. Blank credentials mean no
    # teacher is created, which is the default: nothing is seeded by accident.
    bootstrap-email: ${TEACHER_EMAIL:}
    bootstrap-password: ${TEACHER_PASSWORD:}
    bootstrap-display-name: ${TEACHER_DISPLAY_NAME:}
    bootstrap-timezone: ${TEACHER_TIMEZONE:Europe/Madrid}

management:
  endpoints:
    web:
      exposure:
        # metrics is for the admin only (SecurityConfig); where it is exported to is Fase 17.
        include: health,info,metrics
  endpoint:
    health:
      # Only an admin sees the components (database, disk, paths). Without roles,
      # "when-authorized" meant anyone signed in, students included (26-fase15).
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-} %X{userId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.tennisplatform: INFO
    # Hibernate logs every constraint violation at ERROR, the expected ones included: a lost last
    # seat or two overlapping lessons answer 409 and are not errors. Its message can also quote
    # the values of the row. A violation nobody handles still reaches the log, with its trace, as
    # an unhandled exception.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
