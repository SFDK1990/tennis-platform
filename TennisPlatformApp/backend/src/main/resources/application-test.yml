# Test profile. The datasource URL is intentionally absent: the Testcontainers-backed
# integration test injects a throwaway PostgreSQL connection at runtime.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
  mail:
    # Nothing listens here during tests. The mailer swallows delivery failures on purpose,
    # so this exercises that path too.
    host: localhost
    port: 1025

tennis:
  identity:
    jwt-secret: test-only-secret-value-at-least-32-bytes-long
    # Every test hits the API from 127.0.0.1, so the production limit would throttle the
    # suite itself. The limit is exercised on purpose in AuthRateLimitTest, which lowers it.
    auth-rate-limit-per-minute: 100000

logging:
  level:
    root: WARN
    com.tennisplatform: DEBUG
    liquibase: WARN
    org.testcontainers: WARN
