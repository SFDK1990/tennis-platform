openapi: 3.0.3
info:
  title: Tennis Platform API
  version: "1.0.0"
  description: >
    Contrato de API del MVP de Tennis Platform. Describe lo que el backend hace: los tests de
    integración validan cada respuesta contra este fichero. Convenciones y códigos de negocio en
    Documentos/_arquitectura/11-contrato-api.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: teacher
  - name: students
  - name: availability
  - name: calendar
  - name: lessons
  - name: bookings
  - name: administration

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registro público de alumno
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: >
            Siempre 202 y sin cuerpo, exista o no una cuenta con ese email. Devolver 201
            cuando se crea y 409 cuando ya existe permitiría enumerar usuarios, que es
            precisamente lo que prohíbe 02-arquitectura.md. Si el email ya estaba
            registrado no se crea nada y se avisa por correo al titular real de la dirección.
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login correcto. El refresh token se fija en una cookie HttpOnly (`Set-Cookie`).
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: >
            Único resultado de cualquier fallo: email inexistente, contraseña incorrecta o
            cuenta desactivada. Distinguirlos revelaría qué direcciones tienen cuenta.
            Una cuenta pendiente de verificación SÍ puede iniciar sesión: la verificación
            condiciona reservar, no acceder (ver 13-fase5-analisis-identity.md, decisión 8.5).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (revoca el refresh token actual)
      description: >
        Se autentica con la cookie `refresh_token`, no con el bearer token, y por eso exige el
        token CSRF. Responde 204 aunque no hubiera sesión: limpia la cookie en cualquier caso,
        para que el navegador no siga presentando una muerta.
      security:
        - csrfToken: []
      responses:
        "204": { description: Sesión cerrada }
        "403": { $ref: "#/components/responses/CsrfTokenMissing" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rota el access token usando el refresh token de la cookie
      description: >
        No lleva bearer token: se autentica con la cookie `refresh_token`. Por eso exige el
        token CSRF.
      security:
        - csrfToken: []
      responses:
        "200":
          description: Nuevo access token emitido; refresh token rotado (nueva cookie)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenResponse" }
        "401":
          description: >
            Refresh token ausente, expirado, revocado o reusado (familia revocada). Los cuatro
            casos responden exactamente lo mismo —`AUTH_SESSION_EXPIRED`, con la cookie
            limpiada— para no revelar cuál de ellos ocurrió.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "403": { $ref: "#/components/responses/CsrfTokenMissing" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verifica el email con el token recibido por correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: Email verificado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Token inválido, expirado o ya usado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verification-email:
    post:
      tags: [auth]
      summary: Reenvía el enlace de verificación al usuario autenticado
      description: >-
        Para quien perdió el correo o dejó caducar el enlace. Se pide con sesión, nunca por
        dirección: aceptar un email permitiría inundar el buzón de otro. Cuelga de /auth para
        que le aplique el límite por IP. Los enlaces anteriores siguen valiendo hasta caducar.
      responses:
        "202":
          description: Enviado, o nada que enviar porque la dirección ya estaba verificada
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Solicita un email de recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: >
            Siempre 202, exista o no la cuenta, para no permitir enumeración
            de usuarios (ver 02-arquitectura.md).
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Restablece la contraseña con el token recibido por correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Contraseña actualizada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Token inválido, expirado o ya usado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      tags: [me]
      summary: Perfil del usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Actualiza campos de perfil propios (solo los aplicables al rol del usuario)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: >-
            Validación de campos, o un campo que no corresponde al rol del usuario
            (`FIELD_NOT_APPLICABLE_TO_ROLE`). El rol, el email y el estado de la cuenta no son
            campos de este endpoint: si llegan en el cuerpo se ignoran, nunca se aplican.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/profile:
    get:
      tags: [teacher]
      summary: Perfil público/operativo del profesor único
      description: >-
        Solo lectura. El profesor cambia su perfil con PATCH /me, como cualquier usuario.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/students:
    get:
      tags: [students]
      summary: Lista de alumnos gestionados por el profesor
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: query
          in: query
          description: >-
            Filtro parcial por nombre o email, **restringido a los alumnos que este profesor ya
            gestiona**. Para localizar a un alumno cualquiera del sistema se usa
            `/teacher/students/lookup`, que exige el email exacto: una búsqueda parcial sobre
            todas las cuentas permitiría enumerar quién está registrado en la plataforma.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/students/lookup:
    get:
      tags: [students]
      summary: Localiza un alumno por email exacto, antes de asociarlo
      description: >-
        Solo acepta la dirección completa: ni prefijos, ni comodines, ni coincidencias
        parciales. Quien va a asociar a un alumno conoce su email y no necesita explorar. La
        respuesta no incluye DNI ni dirección.
      parameters:
        - name: email
          in: query
          required: true
          description: Dirección completa, sin distinguir mayúsculas
          schema: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentLookup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Ninguna cuenta de alumno tiene esa dirección
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/students/{userId}:
    get:
      tags: [students]
      summary: Ficha completa de un alumno gestionado
      description: >-
        Incluye `nationalId` y `address`, que son datos personales de acceso restringido. Solo
        responde al profesor que gestiona a ese alumno: conocer el UUID no basta.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            El llamante no es el profesor (`TEACHER_FORBIDDEN`), o no gestiona a ese alumno
            (`STUDENT_NOT_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/students/{userId}/manage:
    post:
      tags: [students]
      summary: Asocia un alumno registrado como gestionado (búsqueda previa por email)
      description: >-
        Si el alumno estaba desactivado, lo reactiva reutilizando la misma relación. El límite
        de alumnos de `platform_configuration` se aplica también en ese caso.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Alumno gestionado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No existe una cuenta de alumno con ese id (`STUDENT_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: El alumno ya está gestionado (`STUDENT_ALREADY_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            El alumno todavía no ha rellenado sus datos personales
            (`STUDENT_PROFILE_INCOMPLETE`), o se alcanzó el límite de alumnos
            (`STUDENT_LIMIT_REACHED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [students]
      summary: Desactiva la gestión de un alumno
      description: >-
        Marca la relación como `INACTIVE` y registra `deactivatedAt`; la fila no se borra, para
        que volver a asociarlo reutilice la relación en vez de crear una segunda.

        Cancela en la misma transaccion las reservas confirmadas del alumno en clases de este
        profesor que aun no han empezado (`CANCELLED_BY_TEACHER`), como exige
        `01-analisis-funcional.md`. Las de clases ya empezadas se conservan: son historico.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Alumno desactivado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            El llamante no es el profesor (`TEACHER_FORBIDDEN`), o nunca gestionó a ese alumno
            (`STUDENT_NOT_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: El alumno ya estaba desactivado (`STUDENT_ALREADY_INACTIVE`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/availability:
    get:
      tags: [availability]
      summary: Reglas semanales y excepciones de un rango de fechas
      description: >
        Legible por cualquier usuario autenticado, igual que el perfil del profesor: un alumno
        necesita saber cuándo trabaja su profesor. El rango es obligatorio y acota **solo las
        excepciones** —las reglas semanales se devuelven enteras, porque son un conjunto
        pequeño—. Sin tope, la respuesta crecería cada temporada sin límite.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Como máximo 62 días después de `from`, ambos incluidos.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "400":
          description: >-
            Rango inválido o más ancho de 62 días (`DATE_RANGE_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/availability/weekly:
    put:
      tags: [availability]
      summary: Reemplaza el conjunto completo de reglas semanales
      description: >
        **No fusiona: reemplaza.** Una regla que el cliente no envíe deja de existir, incluida
        una cuyo `activeFrom` todavía esté en el futuro. Por eso el `GET` devuelve `activeFrom`
        y `activeUntil`: el ciclo leer-editar-escribir tiene que poder reenviar todo lo que
        leyó. Una lista vacía es válida y significa "no tengo horario semanal fijo".

        El conjunto se valida entero antes de escribir nada, así que una petición rechazada
        deja la configuración anterior intacta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyAvailabilityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAvailabilityResponse" }
        "400":
          description: >-
            Dos reglas del mismo día se pisan (`AVAILABILITY_RULES_OVERLAP`), o una regla es
            inválida: día desconocido, fin no posterior al inicio (`AVAILABILITY_INVALID`).
            Tocarse no es solaparse: 09:00-11:00 y 11:00-13:00 son válidas.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/availability/exceptions:
    post:
      tags: [availability]
      summary: Crea un bloqueo o disponibilidad extraordinaria para una fecha
      description: >
        Las excepciones solapadas se aceptan: dos bloqueos que cubren las mismas horas bloquean
        lo mismo, y dos extras suman lo mismo. Cuando una fecha tiene a la vez un `BLOCK` y un
        `EXTRA`, **manda el bloqueo**: equivocarse hacia "no disponible" cuesta un hueco,
        equivocarse al revés pone al profesor a dar clase el día que dijo que no podía.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAvailabilityExceptionRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityException" }
        "400":
          description: >-
            `EXTRA` sin horas, media hora suelta, fin no posterior al inicio o tipo
            desconocido (`AVAILABILITY_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/availability/exceptions/{id}:
    delete:
      tags: [availability]
      summary: Elimina una excepción de disponibilidad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Eliminada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            No existe (`AVAILABILITY_EXCEPTION_NOT_FOUND`). Un id de otro profesor responde lo
            mismo: un 403 confirmaría que el id existe.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /calendar:
    get:
      tags: [calendar]
      summary: Calendario de un rango de dias, para el profesor o para el alumno
      description: >-
        Las fechas se leen en la zona del profesor (timezone en la respuesta), con el tope comun
        de 62 dias. El profesor recibe su disponibilidad resuelta en intervalos y todas sus
        clases, canceladas incluidas. El alumno recibe las clases de los profesores que lo
        gestionan, sin las canceladas salvo que tuviera reserva en ellas, y en cada una su propia
        reserva (myBooking). Un alumno no gestionado recibe listas vacias. Sin notes para nadie.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400":
          description: DATE_RANGE_INVALID, o fechas mal formadas (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AUTH_FORBIDDEN, si quien llama no es profesor ni alumno
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons:
    post:
      tags: [lessons]
      summary: Crea una clase individual o grupal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLessonRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400":
          description: >-
            LESSON_INVALID: duracion que no es multiplo de 30, fin antes del inicio, o la clase
            cruza medianoche en la zona del profesor.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: LESSON_OVERLAP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_OUTSIDE_AVAILABILITY: la clase cae fuera del horario configurado y no se pidio
            overrideAvailability. Releer la disponibilidad no cambia la respuesta: o se mueve la
            clase o se fuerza a proposito. LESSON_IN_THE_PAST (Fase 9): la clase empezaria en el
            instante de crearla o antes; no podria tener reservas ni, por tanto, asistencia.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /lessons/{id}:
    get:
      tags: [lessons]
      summary: Detalle de una clase
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{id}/bookings:
    post:
      tags: [bookings]
      summary: Reserva la clase para el alumno autenticado
      description: >-
        Confirmada al instante. Bloquea la fila de la clase (SELECT ... FOR UPDATE) antes de
        contar plazas, de modo que dos peticiones por la ultima plaza hacen cola y solo una
        gana. Solo para alumnos con el email verificado y gestionados por el profesor de la
        clase. Se puede reservar hasta el inicio de la clase; quien reserva con menos de 24
        horas ya no podra cancelar, y el cliente deberia avisarlo antes de confirmar.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            STUDENT_NOT_MANAGED: el profesor de la clase no gestiona al alumno, o lo desactivo.
            EMAIL_NOT_VERIFIED: el alumno no ha verificado su direccion. AUTH_FORBIDDEN: quien
            llama no es un alumno.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: LESSON_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >-
            LESSON_FULL | BOOKING_ALREADY_EXISTS | STUDENT_SCHEDULE_OVERLAP | LESSON_NOT_BOOKABLE
            (la clase esta cancelada). En los cuatro casos la pantalla del cliente esta obsoleta:
            releer la clase puede cambiar la respuesta.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LESSON_ALREADY_STARTED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /bookings:
    get:
      tags: [bookings]
      summary: Reservas del alumno autenticado, o de las clases del profesor si lo consulta el profesor
      description: >-
        Ordenadas por la clase mas reciente primero. El profesor puede filtrar por lessonId,
        que es lo que construye la pantalla de asistencia. Un lessonId de una clase ajena
        devuelve una pagina vacia, no las reservas de otro.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookingStatus" }
        - name: lessonId
          in: query
          description: Solo para el profesor; el alumno ya ve unicamente las suyas.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AUTH_FORBIDDEN, si quien llama no es alumno ni profesor
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancela una reserva
      description: >-
        El alumno cancela las suyas con al menos 24 horas de antelacion (CANCELLED_BY_STUDENT).
        El profesor cancela cualquiera de sus clases sin ventana (CANCELLED_BY_TEACHER), por la
        misma razon por la que puede cancelar la clase entera. El admin cancela cualquiera sin
        ventana (CANCELLED_BY_ADMIN). Nadie cancela una reserva de una clase que ya empezo: a
        partir de ese momento lo que toca es marcar asistencia.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            BOOKING_NOT_FOUND, tambien cuando la reserva existe pero no es de quien llama:
            confirmar que un id existe es decir algo que no tenia por que saber.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: BOOKING_ALREADY_CANCELLED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            CANCELLATION_WINDOW_EXPIRED (solo alumno, menos de 24 horas) | LESSON_ALREADY_STARTED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/cancel:
    post:
      tags: [lessons]
      summary: Cancela una clase completa
      description: >-
        El profesor puede cancelar su propia clase en cualquier momento. La ventana de 24 horas
        NO le ata: un profesor que enferma la noche antes tiene que poder cancelar. La ventana
        sigue intacta para el alumno que cancela su reserva, que es donde el producto la
        justifico. La respuesta trae cancelledAtShortNotice para que el cliente sepa si hubo
        menos de 24 horas de aviso. Cancela en cascada, en la misma transaccion, todas sus
        reservas confirmadas (CANCELLED_BY_TEACHER): si la cascada falla, la clase no queda
        cancelada.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "LESSON_ALREADY_CANCELLED: ya estaba cancelada, casi siempre una pantalla obsoleta"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_ALREADY_FINISHED: la clase ya termino. Cancelar algo que ya ocurrio es
            reescribir el pasado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/attendance:
    post:
      tags: [bookings]
      summary: Marca asistencia de los participantes de una clase
      description: >-
        Lo sirve el modulo booking aunque la ruta cuelgue de /teacher/lessons: el cuerpo son
        bookingId y la respuesta son reservas. Solo a partir del inicio de la clase, solo sobre
        reservas confirmadas de esa clase, y todo o nada: si una entrada no se puede aplicar,
        no se aplica ninguna. Se puede corregir: marcar de nuevo sustituye lo anterior.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkAttendanceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: BOOKING_NOT_FOUND, si alguna entrada no es una reserva de esta clase y de este profesor
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: BOOKING_ALREADY_CANCELLED, si alguna entrada es una reserva cancelada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: ATTENDANCE_NOT_YET_OPEN
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/configuration:
    get:
      tags: [administration]
      summary: Configuración global de la plataforma
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AUTH_FORBIDDEN, si quien llama no es ADMIN (igual en todo /admin)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    patch:
      tags: [administration]
      summary: Cambia el límite de alumnos y la capacidad máxima de grupo
      description: >-
        Los dos campos son opcionales: el que no se envía conserva su valor. Bajar el límite por
        debajo de los alumnos ya gestionados se permite: no echa a nadie, sólo impide gestionar
        nuevos. Las clases ya creadas conservan su capacidad. Registra updatedAt y updatedBy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConfigurationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConfiguration" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [administration]
      summary: Lista de usuarios de la plataforma, la más reciente primero
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: query
          in: query
          description: >-
            Parte del email, sin distinguir mayúsculas. Al profesor se le niega la búsqueda
            parcial para que no pueda enumerar cuentas; el admin ya puede verlas todas.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSummaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    patch:
      tags: [administration]
      summary: Activa o desactiva la cuenta de un alumno
      description: >-
        Desactivar cierra sus sesiones (el access token vivo caduca en 15 minutos como mucho),
        hace que el profesor deje de gestionarlo y cancela sus reservas futuras como
        CANCELLED_BY_ADMIN. Reactivar devuelve ACTIVE si había verificado el email y
        PENDING_VERIFICATION si no; no vuelve a quedar gestionado, eso lo decide el profesor.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            AUTH_FORBIDDEN si quien llama no es ADMIN; ADMIN_TARGET_NOT_ALLOWED si la cuenta no es
            de un alumno. Desactivar al único profesor apagaría la plataforma, y un admin que
            desactiva a otro, o a sí mismo, puede quedarse sin nadie que lo deshaga.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: USER_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >
        Token CSRF de doble envío, obligatorio en los dos endpoints que se autentican solo con
        la cookie `refresh_token`. El servidor fija una cookie `XSRF-TOKEN` (legible por
        JavaScript) en toda respuesta; el cliente debe devolver ese mismo valor en la cabecera
        `X-XSRF-TOKEN`. Un formulario de otro sitio puede hacer que el navegador envíe la
        cookie, pero no puede leerla para rellenar la cabecera. Sin ella la respuesta es
        `403 AUTH_CSRF_TOKEN_INVALID`. El resto de la API se autoriza con el bearer token, que
        una petición cross-site no puede adjuntar, y por eso no lleva CSRF.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: No autenticado o token expirado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Autenticado pero sin permiso o relación sobre el recurso
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    CsrfTokenMissing:
      description: >
        Falta la cabecera `X-XSRF-TOKEN` o su valor no coincide con la cookie `XSRF-TOKEN`
        (`code`: `AUTH_CSRF_TOKEN_INVALID`). No es un problema de permisos: el cliente debe
        reenviar la petición con la cabecera puesta.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationError:
      description: >-
        Cuerpo, id o parámetro mal formados, o un campo que no pasa la validación
        (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

    TooManyRequests:
      description: >-
        Demasiados intentos desde la misma IP (`AUTH_RATE_LIMITED`). Todo /auth comparte el
        límite; la cabecera Retry-After dice cuántos segundos esperar.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código de negocio, ver 11-contrato-api.md
          example: LESSON_FULL
        instance: { type: string }
        errors:
          type: array
          description: Solo en VALIDATION_ERROR de un cuerpo, un elemento por campo rechazado
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Role:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, DISABLED]
    LessonType:
      type: string
      enum: [INDIVIDUAL, GROUP]
    LessonStatus:
      type: string
      enum: [OPEN, FULL, CANCELLED, COMPLETED]
    BookingStatus:
      type: string
      description: >-
        Si la reserva sigue en pie y, si no, quien la termino. La asistencia NO esta aqui desde la
        Fase 9: ATTENDED y NO_SHOW sacaban la reserva de CONFIRMED y, con ello, del indice unico,
        de la restriccion de solapamiento y del recuento de plazas. Ver Attendance.
      enum: [CONFIRMED, CANCELLED_BY_STUDENT, CANCELLED_BY_TEACHER, CANCELLED_BY_ADMIN]
    Attendance:
      type: string
      enum: [PENDING, ATTENDED, NO_SHOW]
    ManagedStatus:
      type: string
      enum: [MANAGED, INACTIVE]

    UserSummary:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
      description: >
        fullName se retira hasta la Fase 6: el nombre vive en student_profiles, tabla que
        todavía no existe. Aceptar el campo y descartarlo haría creer al cliente que se ha
        guardado. Volverá cuando el módulo student pueda persistirlo.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserSummary" }

    AccessTokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 10 }

    MeResponse:
      type: object
      required: [id, email, role, status, emailVerifiedAt, fullName, phone, nationalId, address, displayName, timezone]
      description: >-
        Forma única para todos los roles: los campos que no aplican llegan a `null`. Un alumno
        recién verificado que aún no ha rellenado sus datos recibe `fullName`, `phone`,
        `nationalId` y `address` a `null`, y esa ausencia es la señal de que el frontend debe
        pedírselos.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        fullName: { type: string, nullable: true, description: "Solo STUDENT" }
        phone: { type: string, nullable: true }
        nationalId: { type: string, nullable: true, description: "Solo STUDENT. Dato restringido: solo visible para el propio usuario, el profesor que lo gestiona o un ADMIN" }
        address: { type: string, nullable: true, description: "Solo STUDENT. Dato restringido, igual que nationalId" }
        displayName: { type: string, nullable: true, description: "Solo TEACHER" }
        timezone: { type: string, nullable: true, description: "Solo TEACHER. Id IANA, p.ej. Europe/Madrid" }

    UpdateMeRequest:
      type: object
      description: >-
        Solo se aceptan los campos aplicables al rol del usuario autenticado. Enviar uno de
        otro rol responde `400` con código `FIELD_NOT_APPLICABLE_TO_ROLE`, en lugar de
        ignorarlo: un cambio descartado en silencio hace creer al cliente que guardó.

        El primer `PATCH` de un alumno debe llevar `fullName`, porque es cuando nace su perfil.
        Los siguientes pueden ser parciales; una cadena vacía borra un campo opcional.
      properties:
        fullName: { type: string, description: "Solo STUDENT" }
        phone: { type: string }
        nationalId: { type: string, description: "Solo STUDENT" }
        address: { type: string, description: "Solo STUDENT" }
        displayName: { type: string, description: "Solo TEACHER" }
        timezone: { type: string, description: "Solo TEACHER" }

    TeacherProfile:
      type: object
      required: [userId, displayName, phone, timezone]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        timezone: { type: string, example: "Europe/Madrid" }

    StudentSummary:
      type: object
      required: [userId, fullName, email, managedStatus, managedAt]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        managedStatus: { $ref: "#/components/schemas/ManagedStatus" }
        managedAt: { type: string, format: date-time, nullable: true }

    StudentLookup:
      type: object
      required: [userId, email, fullName, managedStatus]
      description: >-
        Lo mínimo para confirmar a quién se va a asociar. Sin teléfono, DNI ni dirección.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true, description: "null si el alumno aún no ha rellenado sus datos" }
        managedStatus:
          type: string
          enum: [MANAGED, INACTIVE]
          nullable: true
          description: >-
            null cuando todavía no existe relación con este profesor. Repite los valores de
            ManagedStatus en vez de referenciarlo: en OpenAPI 3.0 un nullable junto a un $ref o
            un allOf no tiene efecto, y el null quedaba fuera del contrato.

    StudentDetail:
      type: object
      required: [userId, email, fullName, phone, nationalId, address, managedStatus, managedAt, deactivatedAt]
      description: >-
        Ficha completa de un alumno gestionado, con los datos restringidos. Nunca se devuelve
        en listados ni búsquedas.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        nationalId: { type: string, nullable: true }
        address: { type: string, nullable: true }
        managedStatus: { $ref: "#/components/schemas/ManagedStatus" }
        managedAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time, nullable: true }

    StudentSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StudentSummary" }

    LocalTime:
      type: string
      description: >
        Hora de pared en la zona del profesor, sin fecha y sin desplazamiento. **Se devuelve
        siempre como `HH:mm:ss`**; a la entrada se acepta también `HH:mm`. No es un instante:
        a qué momento corresponde depende de la fecha y de la zona horaria del profesor.
      example: "09:00:00"

    DayOfWeek:
      type: string
      description: >
        Nombre ISO-8601 del día. Es un nombre y no un número a propósito: alrededor de este
        campo se cruzan tres convenciones —el borrador de este contrato decía 0 = lunes,
        `java.time.DayOfWeek` numera el lunes 1 y `EXTRACT(DOW)` de PostgreSQL numera el
        domingo 0— y un número equivocado no falla en ninguna capa: mueve el horario un día.
        Un nombre equivocado no se puede interpretar.
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    WeeklyAvailabilityRule:
      type: object
      required: [id, dayOfWeek, startTime, endTime, activeFrom, activeUntil]
      properties:
        id: { type: string, format: uuid }
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        startTime: { $ref: "#/components/schemas/LocalTime" }
        endTime: { $ref: "#/components/schemas/LocalTime" }
        activeFrom:
          type: string
          format: date
          nullable: true
          description: Null = aplica desde siempre. Ambos extremos son inclusivos.
        activeUntil: { type: string, format: date, nullable: true }

    WeeklyAvailabilityRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          description: >
            El conjunto completo. Una lista vacía es válida: significa que no hay horario
            semanal fijo.
          items:
            type: object
            required: [dayOfWeek, startTime, endTime]
            properties:
              dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
              startTime: { $ref: "#/components/schemas/LocalTime" }
              endTime: { $ref: "#/components/schemas/LocalTime" }
              activeFrom: { type: string, format: date, nullable: true }
              activeUntil: { type: string, format: date, nullable: true }

    WeeklyAvailabilityResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/WeeklyAvailabilityRule" }

    AvailabilityException:
      type: object
      required: [id, date, startTime, endTime, type]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        startTime:
          type: string
          nullable: true
          description: Null en un `BLOCK` significa el día entero. En un `EXTRA` nunca es null.
        endTime: { type: string, nullable: true }
        type: { type: string, enum: [BLOCK, EXTRA] }

    CreateAvailabilityExceptionRequest:
      type: object
      required: [date, type]
      properties:
        date: { type: string, format: date }
        startTime:
          type: string
          nullable: true
          description: >
            Obligatoria en un `EXTRA`. En un `BLOCK`, omitir las dos horas bloquea el día
            entero; enviar una sola de las dos se rechaza, porque no describe nada.
        endTime: { type: string, nullable: true }
        type: { type: string, enum: [BLOCK, EXTRA] }

    AvailabilityResponse:
      type: object
      required: [weeklyRules, exceptions]
      properties:
        weeklyRules:
          type: array
          items: { $ref: "#/components/schemas/WeeklyAvailabilityRule" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityException" }

    Calendar:
      type: object
      required: [timezone, availability, lessons]
      properties:
        timezone: { type: string, nullable: true, description: "Zona IANA del profesor; null si el alumno no esta gestionado" }
        availability:
          type: array
          items:
            type: object
            required: [startsAt, endsAt]
            properties:
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
        lessons:
          type: array
          items:
            type: object
            required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status, myBooking]
            properties:
              id: { type: string, format: uuid }
              teacherUserId: { type: string, format: uuid }
              type: { $ref: "#/components/schemas/LessonType" }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              capacity: { type: integer }
              bookedCount: { type: integer }
              status: { $ref: "#/components/schemas/LessonStatus" }
              myBooking:
                type: object
                required: [id, status, attendance]
                nullable: true
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/BookingStatus" }
                  attendance: { $ref: "#/components/schemas/Attendance" }

    CreateLessonRequest:
      type: object
      required: [type, startsAt, endsAt, capacity]
      properties:
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity:
          type: integer
          minimum: 1
          description: >-
            Una clase INDIVIDUAL tiene capacidad exactamente 1. Una GROUP va de 1 hasta el tope
            configurado en platform_configuration.max_group_capacity, 8 por defecto.
        notes: { type: string, nullable: true }
        overrideAvailability:
          type: boolean
          default: false
          description: Permite crear la clase fuera de la disponibilidad configurada

    Lesson:
      type: object
      required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status, notes, createdOutsideAvailability, cancelledAt, cancelledAtShortNotice]
      description: >-
        bookedCount es el numero de reservas confirmadas. Se retiro en la Fase 8, cuando solo
        booking podia contarlas y aun no existia, y volvio con la Fase 9.

        status se calcula al leer y no se guarda. La columna solo tiene OPEN y CANCELLED, que es
        lo que decide una persona; COMPLETED se deduce del reloj y FULL del numero de reservas.
        Precedencia: CANCELLED, luego COMPLETED, luego FULL, luego OPEN. Una clase llena que ya
        termino es COMPLETED: de una clase pasada lo que importa es que ocurrio.

        notes es del profesor. Viaja como null para cualquier otro llamante: es texto libre que
        el profesor escribe para si mismo, no para que lo lea el alumno.
      properties:
        id: { type: string, format: uuid }
        teacherUserId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer }
        bookedCount: { type: integer }
        status: { $ref: "#/components/schemas/LessonStatus" }
        notes: { type: string, nullable: true }
        createdOutsideAvailability: { type: boolean }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledAtShortNotice:
          type: boolean
          description: Si la cancelacion dejo menos de 24 horas. Derivado de cancelledAt y startsAt.

    Booking:
      type: object
      required: [id, lessonId, studentUserId, status, attendance, bookedAt, cancelledAt, lesson]
      description: >-
        lesson viaja sin notes para todos: las notas son del profesor y se leen en la propia
        clase, donde se decide quien las ve. Repetir esa regla aqui seria una segunda copia.
      properties:
        id: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        studentUserId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        attendance: { $ref: "#/components/schemas/Attendance" }
        bookedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        lesson:
          type: object
          required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status]
          properties:
            id: { type: string, format: uuid }
            teacherUserId: { type: string, format: uuid }
            type: { $ref: "#/components/schemas/LessonType" }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            capacity: { type: integer }
            bookedCount: { type: integer }
            status: { $ref: "#/components/schemas/LessonStatus" }

    BookingPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Booking" }

    MarkAttendanceRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [bookingId, status]
            properties:
              bookingId: { type: string, format: uuid }
              status: { type: string, enum: [ATTENDED, NO_SHOW] }

    PlatformConfiguration:
      type: object
      required: [studentLimit, maxGroupCapacity, updatedAt, updatedBy]
      properties:
        studentLimit: { type: integer }
        maxGroupCapacity:
          type: integer
          description: >-
            Tope de plazas de una clase grupal, anadido en la Fase 8. Configurable y no una
            constante del codigo: el dia que el numero este mal, lo estara para todas las clases
            a la vez.
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid, nullable: true }

    UpdateConfigurationRequest:
      type: object
      properties:
        studentLimit: { type: integer, minimum: 1 }
        maxGroupCapacity: { type: integer, minimum: 1 }

    AdminUserSummary:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }

    AdminUserSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminUserSummary" }

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }

    Page:
      type: object
      required: [page, size, totalItems]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
