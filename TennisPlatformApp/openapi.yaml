openapi: 3.0.3
info:
  title: Tennis Platform API
  version: "1.0.0"
  description: >
    Contrato de API del MVP de Tennis Platform. Describe lo que el backend hace: los tests de
    integración validan cada respuesta contra este fichero. Convenciones y códigos de negocio en
    Documentos/_arquitectura/11-contrato-api.md.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: teacher
  - name: students
  - name: availability
  - name: calendar
  - name: lessons
  - name: bookings
  - name: passes
  - name: memberships
  - name: messages
  - name: administration

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registro público de alumno
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: >
            Siempre 202 y sin cuerpo, exista o no una cuenta con ese email. Devolver 201
            cuando se crea y 409 cuando ya existe permitiría enumerar usuarios, que es
            precisamente lo que prohíbe 02-arquitectura.md. Si el email ya estaba
            registrado no se crea nada y se avisa por correo al titular real de la dirección,
            como mucho una vez cada 5 minutos.
        "400":
          description: >-
            Cuerpo que no pasa la validación (`VALIDATION_ERROR`), o una contraseña de más de
            72 bytes (`AUTH_WEAK_PASSWORD`): bcrypt no usa el resto, y aceptarla engañaría a
            quien la eligió.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login correcto. El refresh token se fija en una cookie HttpOnly (`Set-Cookie`).
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: >
            Único resultado de cualquier fallo: email inexistente, contraseña incorrecta o
            cuenta desactivada. Distinguirlos revelaría qué direcciones tienen cuenta.
            Una cuenta pendiente de verificación SÍ puede iniciar sesión: la verificación
            condiciona reservar, no acceder (ver 13-fase5-analisis-identity.md, decisión 8.5).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout (revoca el refresh token actual)
      description: >
        Se autentica con la cookie `refresh_token`, no con el bearer token, y por eso exige el
        token CSRF. Responde 204 aunque no hubiera sesión: limpia la cookie en cualquier caso,
        para que el navegador no siga presentando una muerta.
      security:
        - csrfToken: []
      responses:
        "204": { description: Sesión cerrada }
        "403": { $ref: "#/components/responses/CsrfTokenMissing" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rota el access token usando el refresh token de la cookie
      description: >
        No lleva bearer token: se autentica con la cookie `refresh_token`. Por eso exige el
        token CSRF.
      security:
        - csrfToken: []
      responses:
        "200":
          description: Nuevo access token emitido; refresh token rotado (nueva cookie)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenResponse" }
        "401":
          description: >
            Refresh token ausente, expirado, revocado o reusado (familia revocada). Los cuatro
            casos responden exactamente lo mismo —`AUTH_SESSION_EXPIRED`, con la cookie
            limpiada— para no revelar cuál de ellos ocurrió.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "403": { $ref: "#/components/responses/CsrfTokenMissing" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verifica el email con el token recibido por correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: Email verificado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403":
          description: >-
            La cuenta está desactivada (`AUTH_ACCOUNT_NOT_ACTIVE`): el enlace se pidió antes de
            desactivarla.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: Token inválido, expirado o ya usado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/verification-email:
    post:
      tags: [auth]
      summary: Reenvía el enlace de verificación al usuario autenticado
      description: >-
        Para quien perdió el correo o dejó caducar el enlace. Se pide con sesión, nunca por
        dirección: aceptar un email permitiría inundar el buzón de otro. Cuelga de /auth para
        que le aplique el límite por IP. Los enlaces anteriores siguen valiendo hasta caducar.
        Como mucho un reenvío cada 5 minutos; dentro de ese plazo responde igual y no envía nada.
      responses:
        "202":
          description: Enviado, o nada que enviar porque la dirección ya estaba verificada
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Solicita un email de recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: >
            Siempre 202, exista o no la cuenta, para no permitir enumeración
            de usuarios (ver 02-arquitectura.md). Como mucho un correo cada 5 minutos por
            dirección. Al restablecer la contraseña con un enlace, los demás dejan de valer.
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Restablece la contraseña con el token recibido por correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Contraseña actualizada }
        "400":
          description: >-
            Cuerpo que no pasa la validación (`VALIDATION_ERROR`), o una contraseña de más de
            72 bytes (`AUTH_WEAK_PASSWORD`): bcrypt no usa el resto, y aceptarla engañaría a
            quien la eligió.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "403":
          description: >-
            La cuenta está desactivada (`AUTH_ACCOUNT_NOT_ACTIVE`): el enlace se pidió antes de
            desactivarla.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: Token inválido, expirado o ya usado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      tags: [me]
      summary: Perfil del usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Actualiza campos de perfil propios (solo los aplicables al rol del usuario)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: >-
            Validación de campos, o un campo que no corresponde al rol del usuario
            (`FIELD_NOT_APPLICABLE_TO_ROLE`). El rol, el email y el estado de la cuenta no son
            campos de este endpoint: si llegan en el cuerpo se ignoran, nunca se aplican.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/export:
    get:
      tags: [me]
      summary: Descarga todo lo que la plataforma guarda del usuario autenticado
      description: >-
        Un JSON para descargar (`Content-Disposition: attachment`): la cuenta y el perfil, como
        `GET /me`, y para el alumno todas sus reservas con su clase y su asistencia, su ficha y
        los mensajes que recibió. El profesor y el admin reciben esas listas vacías.
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="mis-datos.json"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyDataExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/deletion:
    post:
      tags: [me]
      summary: El alumno borra su cuenta
      description: >-
        Pide la contraseña: no se puede deshacer. En una transacción, la cuenta pierde su email y
        su contraseña (el email real queda libre para registrarse de nuevo), el profesor deja de
        gestionarlo, sus reservas futuras se cancelan como CANCELLED_BY_STUDENT y su perfil se
        vacía. Las reservas pasadas se quedan, a nombre de "Alumno eliminado". Todas sus sesiones
        se cierran. Cuenta para el límite de peticiones por IP, como `/auth/*`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "204": { description: Cuenta borrada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            AUTH_FORBIDDEN: quien llama no es alumno. El profesor y el admin los crea el
            bootstrap y no se borran desde la app.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: La contraseña no es la de la cuenta (`CURRENT_PASSWORD_INCORRECT`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/photo:
    put:
      tags: [me]
      summary: El alumno sube o cambia su foto
      description: >-
        La imagen va tal cual en el cuerpo. El frontend la recorta en cuadrado y la reduce a
        400 x 400 antes de subirla; el servidor sólo acepta JPEG, PNG o WebP de hasta 1 MB, y mira
        el tipo en el contenido, no en el nombre ni en la cabecera (Fase 25.5).
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Guardada
        "400":
          description: PHOTO_INVALID, si no es una imagen de esos tipos o pasa de 1 MB
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [me]
      summary: El alumno quita su foto
      responses:
        "204":
          description: Quitada, o no la tenía
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [me]
      summary: La foto del usuario autenticado
      description: "Sin caché compartida (Cache-Control: no-store). Quien no tiene foto recibe 404."
      responses:
        "200":
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: PHOTO_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /me/password:
    post:
      tags: [me]
      summary: Cambia la contraseña propia y cierra las demás sesiones
      description: >-
        Pide la contraseña actual, para que un access token robado no baste para quedarse con la
        cuenta. Revoca todas las sesiones de la cuenta y abre una nueva en este navegador:
        responde como el login, con el access token en el cuerpo y una cookie de refresco nueva.
        Cuenta para el límite de peticiones por IP, como `/auth/*`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Contraseña cambiada; nueva sesión en este navegador (`Set-Cookie`)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400":
          description: >-
            Cuerpo que no pasa la validación (`VALIDATION_ERROR`), o una contraseña nueva de más
            de 72 bytes (`AUTH_WEAK_PASSWORD`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            La cuenta se desactivó con el access token aún vivo (`AUTH_ACCOUNT_NOT_ACTIVE`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: La contraseña actual no es la de la cuenta (`CURRENT_PASSWORD_INCORRECT`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /teacher/profile:
    get:
      tags: [teacher]
      summary: Perfil público/operativo del profesor único
      description: >-
        Solo lectura. El profesor cambia su perfil con PATCH /me, como cualquier usuario.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/students:
    get:
      tags: [students]
      summary: Lista de alumnos gestionados por el profesor
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: query
          in: query
          description: >-
            Filtro parcial por nombre o email, **restringido a los alumnos que este profesor ya
            gestiona**. Para localizar a un alumno cualquiera del sistema se usa
            `/teacher/students/lookup`, que exige el email exacto: una búsqueda parcial sobre
            todas las cuentas permitiría enumerar quién está registrado en la plataforma.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/students/lookup:
    get:
      tags: [students]
      summary: Localiza un alumno por email exacto, antes de asociarlo
      description: >-
        Solo acepta la dirección completa: ni prefijos, ni comodines, ni coincidencias
        parciales. Quien va a asociar a un alumno conoce su email y no necesita explorar. La
        respuesta no incluye DNI ni dirección.
      parameters:
        - name: email
          in: query
          required: true
          description: Dirección completa, sin distinguir mayúsculas
          schema: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentLookup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Ninguna cuenta de alumno tiene esa dirección
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/students/{userId}:
    get:
      tags: [students]
      summary: Ficha completa de un alumno gestionado
      description: >-
        Incluye `nationalId` y `address`, que son datos personales de acceso restringido. Solo
        responde al profesor que gestiona a ese alumno: conocer el UUID no basta.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            El llamante no es el profesor (`TEACHER_FORBIDDEN`), o no gestiona a ese alumno
            (`STUDENT_NOT_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/students/{userId}/photo:
    get:
      tags: [students]
      summary: La foto de un alumno, para el profesor que lo gestiona ahora
      description: >-
        Un alumno sin foto, que no es suyo o al que dio de baja responde igual: 404. Sin caché
        compartida (Fase 25.5).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PHOTO_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/students/{userId}/record:
    put:
      tags: [students]
      summary: Nivel, objetivos y notas privadas del alumno
      description: >-
        Se reemplazan los tres a la vez; un levelId null quita el nivel. Solo para el profesor que
        gestiona al alumno. Las notas no se ven en la app del alumno, pero salen en la exportacion
        de sus datos (36-fase23-analisis-niveles-ficha.md).
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentRecordRequest" }
      responses:
        "200":
          description: La ficha actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /levels:
    get:
      tags: [teacher]
      summary: Los niveles del profesor, en su orden
      description: Los lee cualquiera con sesion, para saber de que nivel es cada clase (Fase 23).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LevelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/levels:
    post:
      tags: [teacher]
      summary: Anade un nivel al final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLevelRequest" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Level" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "LEVEL_ALREADY_EXISTS: ya hay un nivel con ese nombre"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/levels/{id}:
    patch:
      tags: [teacher]
      summary: Renombra un nivel o lo mueve de puesto
      description: Los demas se reordenan para hacerle sitio.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLevelRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Level" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "LEVEL_ALREADY_EXISTS"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [teacher]
      summary: Borra un nivel que no usa nadie
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Borrado
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "LEVEL_IN_USE: algun alumno o alguna clase lo tiene"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /pass-types:
    get:
      tags: [passes]
      summary: Los tipos de bono del profesor y si hace falta bono para reservar
      description: >-
        Los lee cualquiera con sesion (Fase 27). Un alumno no ve los tipos retirados, que ya no se
        venden; el profesor los ve todos. required dice si el profesor ha encendido "sin bono no
        se reserva"; onlinePayment, si vende los bonos en la app (Fase 27.5).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassTypeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/pass-types:
    post:
      tags: [passes]
      summary: Crea un tipo de bono
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePassTypeRequest" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassType" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "PASS_TYPE_ALREADY_EXISTS: ya hay un tipo de bono con ese nombre"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/pass-types/{id}:
    patch:
      tags: [passes]
      summary: Cambia un tipo de bono, o lo retira
      description: >-
        Los bonos ya vendidos no cambian: copiaron las clases, el precio y la caducidad al
        apuntarse. Un tipo retirado deja de venderse.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePassTypeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassType" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PASS_TYPE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "PASS_TYPE_ALREADY_EXISTS"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [passes]
      summary: Borra un tipo de bono que no ha comprado nadie
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Borrado
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PASS_TYPE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "PASS_TYPE_IN_USE: algun alumno tiene uno; se puede retirar"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/pass-settings:
    put:
      tags: [passes]
      summary: Enciende o apaga "sin bono no se reserva" y el pago online
      description: >-
        Los dos interruptores nacen apagados. required (decision 2 de 41-fase27-analisis-bonos.md):
        apagado, se reserva sin bono y la reserva no gasta ninguno. onlinePayment (decision 2 de
        42-fase27.5-analisis-pago-online.md): apagado, el alumno no puede comprar bonos en la app.
        El que no se manda conserva su valor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassSettingsRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassSettings" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            ONLINE_PAYMENT_UNAVAILABLE: el servidor no tiene las claves de la pasarela, asi que el
            pago online no se puede encender
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/passes:
    get:
      tags: [passes]
      summary: Los bonos de los alumnos del profesor, o de uno
      parameters:
        - name: studentUserId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK, los mas nuevos primero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/students/{userId}/passes:
    post:
      tags: [passes]
      summary: Apunta un bono que el alumno ha pagado
      description: >-
        La app no cobra: el profesor apunta que y como se pago. Las clases, el precio y la
        caducidad salen del tipo; la caducidad cuenta desde el dia del pago.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordPassRequest" }
      responses:
        "201":
          description: Apuntado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pass" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: PASS_TYPE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: "PASS_TYPE_RETIRED: el tipo ya no se vende"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/passes/{id}/void:
    post:
      tags: [passes]
      summary: Anula un bono apuntado por error
      description: Solo mientras no se haya reservado ninguna clase con el.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Anulado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pass" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PASS_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "PASS_ALREADY_USED: ya se reservo alguna clase con el"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /me/passes:
    get:
      tags: [passes]
      summary: Los bonos del alumno autenticado, con su saldo
      responses:
        "200":
          description: OK, los mas nuevos primero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/pass-purchases:
    post:
      tags: [passes]
      summary: El alumno empieza a comprar un bono y recibe la pagina de pago
      description: >-
        Fase 27.5. El importe sale del tipo, no del navegador. La compra copia el tipo: lo que se
        cobra y el bono que sale no cambian aunque el profesor lo cambie despues. El bono no existe
        todavia: nace cuando la pasarela avisa de que el pago ha llegado. checkoutUrl es la pagina
        de Stripe a la que el frontend manda al alumno.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartPurchaseRequest" }
      responses:
        "201":
          description: Compra empezada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassPurchase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AUTH_FORBIDDEN | EMAIL_NOT_VERIFIED | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: PASS_TYPE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >-
            ONLINE_PAYMENT_DISABLED: el profesor no vende bonos en la app |
            ONLINE_PAYMENT_UNAVAILABLE: el servidor no tiene las claves de la pasarela
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            PASS_TYPE_RETIRED: el tipo ya no se vende | PRICE_TOO_LOW_TO_PAY_ONLINE: la pasarela no
            cobra menos de 0,50 euros
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "503":
          description: "PAYMENT_GATEWAY_UNAVAILABLE: la pasarela no ha contestado o se ha negado"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /me/pass-purchases/{id}:
    get:
      tags: [passes]
      summary: Una compra del alumno, para saber si el bono ya esta
      description: >-
        Al volver de la pagina de pago, el frontend pregunta aqui hasta que la compra esta PAID.
        La de otro alumno no existe para el.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassPurchase" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: PURCHASE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /payments/stripe/webhook:
    post:
      tags: [passes]
      summary: Los avisos de Stripe sobre los pagos de bonos
      description: >-
        Publico: Stripe no tiene sesion. Lo protege la firma de Stripe-Signature, que se comprueba
        con el secreto del servidor antes de leer nada, con cinco minutos de tolerancia. Un pago
        confirmado crea el bono una sola vez, y solo si se cobro lo que pedia la compra; los demas
        avisos se contestan sin hacer nada.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204":
          description: Recibido
        "400":
          description: "INVALID_WEBHOOK_SIGNATURE: sin firma, con una firma mala o caducada, o no es JSON"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /groups:
    get:
      tags: [memberships]
      summary: Los grupos fijos de la escuela
      description: >-
        Los lee cualquiera con sesion (Fase 28). Sin quien esta apuntado: members viaja vacio y
        memberCount dice cuantos son.
      responses:
        "200":
          description: OK, por nombre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedGroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/groups:
    get:
      tags: [memberships]
      summary: Los grupos fijos del profesor, con sus apuntados
      responses:
        "200":
          description: OK, por nombre
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedGroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [memberships]
      summary: Crea un grupo fijo
      description: >-
        Un grupo es un nombre y una cuota al mes; sus clases son las de las series que se le
        enganchan (decision 1 de 43-fase28-analisis-mensualidades.md).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedGroup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "GROUP_ALREADY_EXISTS: ya hay un grupo con ese nombre"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/groups/{id}:
    patch:
      tags: [memberships]
      summary: Cambia el nombre o la cuota de un grupo
      description: >-
        La cuota nueva es la que se propone al apuntar los meses que quedan; lo ya apuntado no
        cambia.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedGroup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "GROUP_ALREADY_EXISTS"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [memberships]
      summary: Borra un grupo al que nunca se ha apuntado nadie
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Borrado; sus series quedan como estaban
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "GROUP_IN_USE: alguien se ha apuntado alguna vez, y sus cuotas lo apuntan"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/groups/{id}/series:
    post:
      tags: [memberships]
      summary: Engancha una serie semanal al grupo
      description: >-
        Cada apuntado recibe plaza en las clases de la serie que quedan, todas o ninguna: si alguna
        no tiene sitio para todos, la serie no se engancha.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachSeriesRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedGroup" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: GROUP_NOT_FOUND | SERIES_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >-
            SERIES_ALREADY_IN_GROUP: la serie ya es de un grupo | GROUP_FULL: alguna clase no tiene
            plaza para todos los apuntados (fullLessons dice cuales) | STUDENT_SCHEDULE_OVERLAP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: "LEVEL_NOT_ALLOWED: algun apuntado es de otro nivel que la serie"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/groups/{id}/members:
    post:
      tags: [memberships]
      summary: Apunta a un alumno al grupo
      description: >-
        Como cuando se apunta el alumno, pero sin pedir el correo verificado: el profesor le
        conoce (decision 2).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: Apuntado, con plaza en cada clase que queda
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMember" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: ALREADY_IN_GROUP | GROUP_FULL | STUDENT_SCHEDULE_OVERLAP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LEVEL_NOT_ALLOWED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/groups/{id}/members/{userId}:
    delete:
      tags: [memberships]
      summary: Da de baja a un alumno del grupo
      description: >-
        Sigue en sus clases hasta fin de mes; las del mes siguiente en adelante se liberan y pasan a
        la lista de espera (decision 5).
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Dado de baja
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "GROUP_NOT_FOUND | NOT_IN_GROUP: no esta, o ya se esta dando de baja"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /me/groups/{id}/membership:
    post:
      tags: [memberships]
      summary: El alumno se apunta al grupo
      description: >-
        Reserva una plaza en cada clase del grupo que aun no ha empezado, todas o ninguna, sin
        gastar bono: las paga la cuota. Pide lo mismo que reservar: alumno gestionado, correo
        verificado y nivel.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Apuntado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: STUDENT_FORBIDDEN | EMAIL_NOT_VERIFIED | STUDENT_NOT_MANAGED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: GROUP_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: ALREADY_IN_GROUP | GROUP_FULL | STUDENT_SCHEDULE_OVERLAP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LEVEL_NOT_ALLOWED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [memberships]
      summary: El alumno se da de baja del grupo
      description: Sigue en sus clases hasta fin de mes; las siguientes se liberan (decision 5).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Dado de baja
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: GROUP_NOT_FOUND | NOT_IN_GROUP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /me/memberships:
    get:
      tags: [memberships]
      summary: Los grupos del alumno y sus cuotas
      responses:
        "200":
          description: OK, los mas nuevos primero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/fees:
    get:
      tags: [memberships]
      summary: Como esta cada mes de cada apuntado
      description: >-
        Sin month, todos los meses hasta el actual y los apuntados por adelantado; con month, solo
        ese. Un mes se debe si el grupo tiene en el alguna clase, no cancelada, de las del alumno.
        OVERDUE se calcula al leer: pasado el dia de vencimiento, o el dia en que se apunto si fue
        despues, sin nada apuntado.
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, example: "2026-11" }
        - name: studentUserId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK, el mes mas reciente primero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeLineList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [memberships]
      summary: Apunta un mes como pagado o como que no se cobra
      description: >-
        La app no cobra: el profesor apunta que y como se pago. Sin amountCents, un mes pagado
        cuesta la cuota del grupo. WAIVED no lleva importe, dia ni forma de pago.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordFeeRequest" }
      responses:
        "201":
          description: Apuntado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: NOT_IN_GROUP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "FEE_ALREADY_PAID: ese mes ya tiene algo apuntado; se anula antes"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/fees/{id}/void:
    post:
      tags: [memberships]
      summary: Anula un mes apuntado por error
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Anulado; el mes se puede volver a apuntar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fee" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: FEE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/fee-settings:
    put:
      tags: [memberships]
      summary: Cambia el dia del mes en que vence la cuota
      description: El mismo para todos los grupos (decision 3); nace en el 5.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeSettings" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/students/{userId}/manage:
    post:
      tags: [students]
      summary: Asocia un alumno registrado como gestionado (búsqueda previa por email)
      description: >-
        Si el alumno estaba desactivado, lo reactiva reutilizando la misma relación. El límite
        de alumnos de `platform_configuration` se aplica también en ese caso.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Alumno gestionado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No existe una cuenta de alumno con ese id (`STUDENT_NOT_FOUND`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: El alumno ya está gestionado (`STUDENT_ALREADY_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            El alumno todavía no ha rellenado sus datos personales
            (`STUDENT_PROFILE_INCOMPLETE`), o se alcanzó el límite de alumnos
            (`STUDENT_LIMIT_REACHED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [students]
      summary: Desactiva la gestión de un alumno
      description: >-
        Marca la relación como `INACTIVE` y registra `deactivatedAt`; la fila no se borra, para
        que volver a asociarlo reutilice la relación en vez de crear una segunda.

        Cancela en la misma transaccion las reservas confirmadas del alumno en clases de este
        profesor que aun no han empezado (`CANCELLED_BY_TEACHER`), como exige
        `01-analisis-funcional.md`. Las de clases ya empezadas se conservan: son historico.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Alumno desactivado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            El llamante no es el profesor (`TEACHER_FORBIDDEN`), o nunca gestionó a ese alumno
            (`STUDENT_NOT_MANAGED`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: El alumno ya estaba desactivado (`STUDENT_ALREADY_INACTIVE`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/availability:
    get:
      tags: [availability]
      summary: Reglas semanales y excepciones de un rango de fechas
      description: >
        Legible por cualquier usuario autenticado, igual que el perfil del profesor: un alumno
        necesita saber cuándo trabaja su profesor. El rango es obligatorio y acota **solo las
        excepciones** —las reglas semanales se devuelven enteras, porque son un conjunto
        pequeño—. Sin tope, la respuesta crecería cada temporada sin límite.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Como máximo 62 días después de `from`, ambos incluidos.
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "400":
          description: >-
            Rango inválido o más ancho de 62 días (`DATE_RANGE_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/availability/weekly:
    put:
      tags: [availability]
      summary: Reemplaza el conjunto completo de reglas semanales
      description: >
        **No fusiona: reemplaza.** Una regla que el cliente no envíe deja de existir, incluida
        una cuyo `activeFrom` todavía esté en el futuro. Por eso el `GET` devuelve `activeFrom`
        y `activeUntil`: el ciclo leer-editar-escribir tiene que poder reenviar todo lo que
        leyó. Una lista vacía es válida y significa "no tengo horario semanal fijo".

        El conjunto se valida entero antes de escribir nada, así que una petición rechazada
        deja la configuración anterior intacta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyAvailabilityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeeklyAvailabilityResponse" }
        "400":
          description: >-
            Dos reglas del mismo día se pisan (`AVAILABILITY_RULES_OVERLAP`), o una regla es
            inválida: día desconocido, fin no posterior al inicio (`AVAILABILITY_INVALID`).
            Tocarse no es solaparse: 09:00-11:00 y 11:00-13:00 son válidas.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/availability/exceptions:
    post:
      tags: [availability]
      summary: Crea un bloqueo o disponibilidad extraordinaria para una fecha
      description: >
        Las excepciones solapadas se aceptan: dos bloqueos que cubren las mismas horas bloquean
        lo mismo, y dos extras suman lo mismo. Cuando una fecha tiene a la vez un `BLOCK` y un
        `EXTRA`, **manda el bloqueo**: equivocarse hacia "no disponible" cuesta un hueco,
        equivocarse al revés pone al profesor a dar clase el día que dijo que no podía.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAvailabilityExceptionRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityException" }
        "400":
          description: >-
            `EXTRA` sin horas, media hora suelta, fin no posterior al inicio o tipo
            desconocido (`AVAILABILITY_INVALID`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/availability/exceptions/{id}:
    delete:
      tags: [availability]
      summary: Elimina una excepción de disponibilidad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Eliminada }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            No existe (`AVAILABILITY_EXCEPTION_NOT_FOUND`). Un id de otro profesor responde lo
            mismo: un 403 confirmaría que el id existe.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /calendar:
    get:
      tags: [calendar]
      summary: Calendario de un rango de dias, para el profesor, el alumno o el admin
      description: >-
        Las fechas se leen en la zona del profesor (timezone en la respuesta), con el tope comun
        de 62 dias. El profesor recibe su disponibilidad resuelta en intervalos y todas sus
        clases, canceladas incluidas. El alumno recibe las clases de los profesores que lo
        gestionan, sin las canceladas salvo que tuviera reserva en ellas, y en cada una su propia
        reserva (myBooking). Un alumno no gestionado recibe listas vacias. El admin recibe lo
        mismo que el profesor, para resolver incidencias. Sin notes para nadie.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }
        "400":
          description: DATE_RANGE_INVALID, o fechas mal formadas (VALIDATION_ERROR)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/summary:
    get:
      tags: [calendar]
      summary: El resumen de un mes del profesor, con el anterior y el desglose por nivel
      description: >-
        Los meses son los del profesor, en su zona. Cuenta las clases que empiezan en el mes y,
        si es el mes en curso, hasta ahora. Clases dadas son las que ya han empezado y no se
        cancelaron; las plazas son las de esas clases; la asistencia sale de las plazas en las que
        se paso lista. Un alumno activo es el que tuvo plaza en alguna clase dada del mes, haya
        venido o no; las reservas de una cuenta borrada siguen contando (Fase 25).
      parameters:
        - name: month
          in: query
          description: El mes, como 2026-10. Si falta, el mes en curso.
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', example: "2026-10" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthSummary" }
        "400":
          description: DATE_RANGE_INVALID, si el mes esta mal escrito o aun no ha empezado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/lessons:
    post:
      tags: [lessons]
      summary: Crea una clase individual o grupal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLessonRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400":
          description: >-
            LESSON_INVALID: duracion que no es multiplo de 30, fin antes del inicio, o la clase
            cruza medianoche en la zona del profesor.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: COURT_NOT_FOUND, si la pista elegida no existe
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: LESSON_OVERLAP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_OUTSIDE_AVAILABILITY: la clase cae fuera del horario configurado y no se pidio
            overrideAvailability. Releer la disponibilidad no cambia la respuesta: o se mueve la
            clase o se fuerza a proposito. LESSON_IN_THE_PAST (Fase 9): la clase empezaria en el
            instante de crearla o antes; no podria tener reservas ni, por tanto, asistencia.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /lessons/{id}:
    get:
      tags: [lessons]
      summary: Detalle de una clase
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /lessons/{id}/bookings:
    post:
      tags: [bookings]
      summary: Reserva la clase para el alumno autenticado
      description: >-
        Confirmada al instante. Bloquea la fila de la clase (SELECT ... FOR UPDATE) antes de
        contar plazas, de modo que dos peticiones por la ultima plaza hacen cola y solo una
        gana. Solo para alumnos con el email verificado y gestionados por el profesor de la
        clase. Se puede reservar hasta el inicio de la clase; quien reserva con menos de 24
        horas ya no podra cancelar, y el cliente deberia avisarlo antes de confirmar.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Reserva confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            STUDENT_NOT_MANAGED: el profesor de la clase no gestiona al alumno, o lo desactivo.
            EMAIL_NOT_VERIFIED: el alumno no ha verificado su direccion. AUTH_FORBIDDEN: quien
            llama no es un alumno.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: LESSON_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >-
            LESSON_FULL | BOOKING_ALREADY_EXISTS | STUDENT_SCHEDULE_OVERLAP | LESSON_NOT_BOOKABLE
            (la clase esta cancelada). En los cuatro casos la pantalla del cliente esta obsoleta:
            releer la clase puede cambiar la respuesta.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_ALREADY_STARTED | LEVEL_NOT_ALLOWED (la clase es de otro nivel) |
            NO_PASS_BALANCE (el profesor pide bono y al alumno no le quedan clases de ese tipo en un
            bono valido el dia de la clase)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /lessons/{id}/waiting-list:
    post:
      tags: [bookings]
      summary: Apunta al alumno autenticado a la lista de espera de una clase llena
      description: >-
        Las mismas comprobaciones que al reservar, en el mismo orden, y ademas: solo si la clase
        esta llena, y solo hasta 24 horas antes de que empiece. Cuando se libera una plaza, se
        reserva sola para el primero de la lista, en la misma transaccion que la libera
        (34-fase21-analisis-lista-espera.md).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: En la lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingPlace" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: STUDENT_NOT_MANAGED | EMAIL_NOT_VERIFIED | AUTH_FORBIDDEN (quien llama no es un alumno).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: LESSON_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: >-
            LESSON_NOT_FULL (hay plaza: se reserva) | ALREADY_WAITING | BOOKING_ALREADY_EXISTS |
            STUDENT_SCHEDULE_OVERLAP | LESSON_NOT_BOOKABLE (la clase esta cancelada).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_ALREADY_STARTED | WAITING_LIST_CLOSED (empieza en menos de 24 horas) |
            LEVEL_NOT_ALLOWED | NO_PASS_BALANCE (se pregunta, pero no se gasta hasta que llega la plaza).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    delete:
      tags: [bookings]
      summary: Saca al alumno autenticado de la lista de espera
      description: Sin ventana, y tambien responde 204 si no estaba en ella.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Fuera de la lista
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /waiting-list:
    get:
      tags: [bookings]
      summary: Las listas de espera del alumno autenticado que siguen abiertas
      description: Con su puesto en cada una, de la clase mas proxima a la mas lejana.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingPlaceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/lessons/{id}/waiting-list:
    get:
      tags: [bookings]
      summary: Quien espera plaza en una clase del profesor, en orden
      description: >-
        Solo para consultar. Una clase ajena devuelve la lista vacia, como las reservas de una
        clase ajena.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitingStudentList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /bookings:
    get:
      tags: [bookings]
      summary: Reservas del alumno autenticado, de las clases del profesor, o todas para el admin
      description: >-
        Ordenadas por la clase mas reciente primero. El profesor puede filtrar por lessonId,
        que es lo que construye la pantalla de asistencia. Un lessonId de una clase ajena
        devuelve una pagina vacia, no las reservas de otro. El admin ve todas, con los mismos
        filtros, para resolver incidencias.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookingStatus" }
        - name: lessonId
          in: query
          description: Para el profesor y el admin; el alumno ya ve unicamente las suyas.
          schema: { type: string, format: uuid }
        - name: studentUserId
          in: query
          description: >-
            Solo para el profesor: el historial de un alumno (Fase 23). Un alumno que no gestiona
            da la pagina vacia.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancela una reserva
      description: >-
        El alumno cancela las suyas con al menos 24 horas de antelacion (CANCELLED_BY_STUDENT).
        El profesor cancela cualquiera de sus clases sin ventana (CANCELLED_BY_TEACHER), por la
        misma razon por la que puede cancelar la clase entera. El admin cancela cualquiera sin
        ventana (CANCELLED_BY_ADMIN). Nadie cancela una reserva de una clase que ya empezo: a
        partir de ese momento lo que toca es marcar asistencia.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            BOOKING_NOT_FOUND, tambien cuando la reserva existe pero no es de quien llama:
            confirmar que un id existe es decir algo que no tenia por que saber.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: BOOKING_ALREADY_CANCELLED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            CANCELLATION_WINDOW_EXPIRED (solo alumno, menos de 24 horas) | LESSON_ALREADY_STARTED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/cancellations:
    post:
      tags: [lessons]
      summary: Cancela todas las clases de un dia (lluvia)
      description: >-
        Cancela las clases del profesor que empiezan ese dia en su zona horaria y que ni han
        empezado ni estaban ya canceladas, cada una con sus reservas (CANCELLED_BY_TEACHER).
        Todo en una transaccion: o se cancela el dia entero o nada. Un dia sin clases responde
        la lista vacia. Cada alumno recibe un correo por reserva, con el motivo si lo hay, que
        no se guarda (Fase 20).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelDayRequest" }
      responses:
        "200":
          description: Las clases canceladas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelledDay" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "DATE_IN_THE_PAST: el dia ya paso en la zona del profesor"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/series/preview:
    post:
      tags: [lessons]
      summary: Las fechas de una clase que se repite cada semana, sin crear nada
      description: >-
        Cada semana, el mismo dia y a la misma hora de pared en la zona del profesor, tambien
        cuando cambia la hora (35-fase22-analisis-clases-que-se-repiten.md). Cada fecha trae su
        estado: OK, OUTSIDE_AVAILABILITY (se puede crear igualmente), OVERLAP (choca con otra
        clase: no se puede crear) o IN_THE_PAST (solo la primera puede estarlo).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesPreviewRequest" }
      responses:
        "200":
          description: Las fechas de la serie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: COURT_NOT_FOUND, si la pista elegida no existe
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/series:
    post:
      tags: [lessons]
      summary: Crea las fechas elegidas de una clase que se repite cada semana
      description: >-
        Todas o ninguna, en una transaccion. Cada fecha tiene que ser una de la serie. Las clases
        comparten seriesId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSeriesRequest" }
      responses:
        "201":
          description: Las clases creadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: COURT_NOT_FOUND, si la pista elegida no existe
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "LESSON_OVERLAP: una fecha elegida choca ya con otra clase; no se crea ninguna"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LESSON_OUTSIDE_AVAILABILITY (sin overrideAvailability) | LESSON_IN_THE_PAST
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/cancel-following:
    post:
      tags: [lessons]
      summary: Cancela la clase y las siguientes de su serie
      description: >-
        Cada una con sus reservas y en una transaccion, como cancelar una clase; las ya
        canceladas o terminadas se dejan como estan. Cada alumno recibe su correo, con el motivo
        si lo hay.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelLessonRequest" }
      responses:
        "200":
          description: Las clases canceladas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "LESSON_NOT_IN_SERIES: la clase se creo suelta"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /courts:
    get:
      tags: [lessons]
      summary: Las pistas de la escuela, en su orden
      description: La primera es donde va una clase si no se elige otra (Fase 25.6).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourtList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /teacher/courts/{id}:
    patch:
      tags: [lessons]
      summary: Cambia el nombre de una pista
      description: Añadir o quitar pistas llega con el club; ahora sólo se renombran (Fase 25.6).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameCourtRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Court" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: COURT_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: "COURT_ALREADY_EXISTS: otra pista ya se llama así"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/court:
    put:
      tags: [lessons]
      summary: Pasa una clase que no ha empezado a otra pista
      description: >-
        Quien tiene plaza la conserva, y si la pista cambia de verdad recibe un correo después del
        commit (Fase 25.6).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeCourtRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: LESSON_NOT_FOUND o COURT_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: LESSON_ALREADY_CANCELLED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LESSON_ALREADY_STARTED
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/level:
    put:
      tags: [lessons]
      summary: Pone la clase en un nivel, o la abre a todos con null
      description: Quien ya tiene plaza la conserva (Fase 23).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeLevelRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teacher/lessons/{id}:
    patch:
      tags: [lessons]
      summary: Cambia las notas o la capacidad de una clase que no ha empezado
      description: >-
        La hora no se cambia: los alumnos reservaron esa hora, y moverla es cancelar y crear otra.
        La capacidad sigue la regla de la creación (1 en una individual, hasta
        max_group_capacity en una grupal) y no baja de las reservas confirmadas. Bloquea la clase
        como una reserva antes de contar, para que una reserva simultánea no se quede sin plaza.
        Un campo ausente no cambia; unas notas en blanco se borran.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditLessonRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400":
          description: VALIDATION_ERROR, o LESSON_INVALID si la capacidad no cabe en el tipo de clase
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            LESSON_ALREADY_CANCELLED, o LESSON_CAPACITY_BELOW_BOOKINGS: ya hay más alumnos
            reservados que la capacidad pedida. Si alguno cancela, releer puede cambiar la respuesta.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LESSON_ALREADY_STARTED, la clase ya empezó
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/cancel:
    post:
      tags: [lessons]
      summary: Cancela una clase completa
      description: >-
        El profesor puede cancelar su propia clase en cualquier momento. La ventana de 24 horas
        NO le ata: un profesor que enferma la noche antes tiene que poder cancelar. La ventana
        sigue intacta para el alumno que cancela su reserva, que es donde el producto la
        justifico. La respuesta trae cancelledAtShortNotice para que el cliente sepa si hubo
        menos de 24 horas de aviso. Cancela en cascada, en la misma transaccion, todas sus
        reservas confirmadas (CANCELLED_BY_TEACHER): si la cascada falla, la clase no queda
        cancelada. Cada alumno recibe un correo con el motivo, si lo hay, y un .ics de
        cancelacion (Fase 20).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelLessonRequest" }
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "LESSON_ALREADY_CANCELLED: ya estaba cancelada, casi siempre una pantalla obsoleta"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            LESSON_ALREADY_FINISHED: la clase ya termino. Cancelar algo que ya ocurrio es
            reescribir el pasado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /admin/lessons/{id}/cancel:
    post:
      tags: [administration]
      summary: El admin cancela una clase para resolver una incidencia
      description: >-
        Como la cancelación del profesor, sin ventana de 24 horas, pero sus reservas confirmadas
        pasan a CANCELLED_BY_ADMIN, para que el alumno sepa quién lo decidió. Una ruta propia y no
        la del profesor: el prefijo dice quién puede llamarla.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "LESSON_ALREADY_CANCELLED: ya estaba cancelada, casi siempre una pantalla obsoleta"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: LESSON_ALREADY_FINISHED, la clase ya terminó
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/lessons/{id}/attendance:
    post:
      tags: [bookings]
      summary: Marca asistencia de los participantes de una clase
      description: >-
        Lo sirve el modulo booking aunque la ruta cuelgue de /teacher/lessons: el cuerpo son
        bookingId y la respuesta son reservas. Solo a partir del inicio de la clase, solo sobre
        reservas confirmadas de esa clase, y todo o nada: si una entrada no se puede aplicar,
        no se aplica ninguna. Se puede corregir: marcar de nuevo sustituye lo anterior.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkAttendanceRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: TEACHER_FORBIDDEN
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: BOOKING_NOT_FOUND, si alguna entrada no es una reserva de esta clase y de este profesor
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "409":
          description: BOOKING_ALREADY_CANCELLED, si alguna entrada es una reserva cancelada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: ATTENDANCE_NOT_YET_OPEN
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /teacher/messages:
    post:
      tags: [messages]
      summary: Escribe a todos los alumnos, a un nivel, a los de una clase o a los de su serie
      description: >-
        Los destinatarios se fijan al enviar: son los alumnos que el profesor gestiona y que en ese
        momento estan en el destino. Para LESSON, los que tienen reserva confirmada en la clase; para
        SERIES, los que la tienen en alguna clase de la serie que aun no ha empezado. Cada uno lo ve
        en GET /messages y, si tiene el email verificado, lo recibe por correo despues del commit
        (Fase 24).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: LEVEL_NOT_FOUND o LESSON_NOT_FOUND, tambien si son de otro profesor
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            NO_RECIPIENTS si en el destino no hay ningun alumno; LESSON_NOT_IN_SERIES si se pide
            SERIES de una clase creada suelta
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    get:
      tags: [messages]
      summary: Los mensajes que ha enviado el profesor, el mas reciente primero
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessagePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /teacher/messages/{id}:
    delete:
      tags: [messages]
      summary: Quita un mensaje del tablon de todos sus destinatarios
      description: El correo ya ha salido y no se retira.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Borrado
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: MESSAGE_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /messages:
    get:
      tags: [messages]
      summary: El tablon del usuario autenticado, el mas reciente primero
      description: >-
        Solo los mensajes que se le enviaron a el. El profesor y el admin reciben la pagina vacia.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivedMessagePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/configuration:
    get:
      tags: [administration]
      summary: Configuración global de la plataforma
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConfiguration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: AUTH_FORBIDDEN, si quien llama no es ADMIN (igual en todo /admin)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
    patch:
      tags: [administration]
      summary: Cambia el límite de alumnos y la capacidad máxima de grupo
      description: >-
        Los dos campos son opcionales: el que no se envía conserva su valor. Bajar el límite por
        debajo de los alumnos ya gestionados se permite: no echa a nadie, sólo impide gestionar
        nuevos. Las clases ya creadas conservan su capacidad. Registra updatedAt y updatedBy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConfigurationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformConfiguration" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users:
    get:
      tags: [administration]
      summary: Lista de usuarios de la plataforma, la más reciente primero
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: query
          in: query
          description: >-
            Parte del email, sin distinguir mayúsculas. Al profesor se le niega la búsqueda
            parcial para que no pueda enumerar cuentas; el admin ya puede verlas todas.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSummaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    patch:
      tags: [administration]
      summary: Activa o desactiva la cuenta de un alumno
      description: >-
        Desactivar cierra sus sesiones (el access token vivo caduca en 15 minutos como mucho),
        hace que el profesor deje de gestionarlo y cancela sus reservas futuras como
        CANCELLED_BY_ADMIN. Reactivar devuelve ACTIVE si había verificado el email y
        PENDING_VERIFICATION si no; no vuelve a quedar gestionado, eso lo decide el profesor.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserStatusRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            AUTH_FORBIDDEN si quien llama no es ADMIN; ADMIN_TARGET_NOT_ALLOWED si la cuenta no es
            de un alumno. Desactivar al único profesor apagaría la plataforma, y un admin que
            desactiva a otro, o a sí mismo, puede quedarse sin nadie que lo deshaga.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "404":
          description: USER_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "422":
          description: >-
            ACCOUNT_DELETED: el alumno borró su cuenta. Es definitivo; no hay nadie a quien
            devolvérsela.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >
        Token CSRF de doble envío, obligatorio en los dos endpoints que se autentican solo con
        la cookie `refresh_token`. El servidor fija una cookie `XSRF-TOKEN` (legible por
        JavaScript) en toda respuesta; el cliente debe devolver ese mismo valor en la cabecera
        `X-XSRF-TOKEN`. Un formulario de otro sitio puede hacer que el navegador envíe la
        cookie, pero no puede leerla para rellenar la cabecera. Sin ella la respuesta es
        `403 AUTH_CSRF_TOKEN_INVALID`. El resto de la API se autoriza con el bearer token, que
        una petición cross-site no puede adjuntar, y por eso no lleva CSRF.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthorized:
      description: No autenticado o token expirado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Autenticado pero sin permiso o relación sobre el recurso
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    CsrfTokenMissing:
      description: >
        Falta la cabecera `X-XSRF-TOKEN` o su valor no coincide con la cookie `XSRF-TOKEN`
        (`code`: `AUTH_CSRF_TOKEN_INVALID`). No es un problema de permisos: el cliente debe
        reenviar la petición con la cabecera puesta.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ValidationError:
      description: >-
        Cuerpo, id o parámetro mal formados, o un campo que no pasa la validación
        (`VALIDATION_ERROR`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

    TooManyRequests:
      description: >-
        Demasiados intentos desde la misma IP (`AUTH_RATE_LIMITED`). Todo /auth comparte el
        límite; la cabecera Retry-After dice cuántos segundos esperar.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    ProblemDetails:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código de negocio, ver 11-contrato-api.md
          example: LESSON_FULL
        instance: { type: string }
        fullLessons:
          type: array
          description: Solo en GROUP_FULL, cuando empieza cada clase sin plaza (Fase 28)
          items: { type: string, format: date-time }
        errors:
          type: array
          description: Solo en VALIDATION_ERROR de un cuerpo, un elemento por campo rechazado
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Role:
      type: string
      enum: [ADMIN, TEACHER, STUDENT]
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, DISABLED, DELETED]
      description: >-
        DELETED: el alumno borró su cuenta. El email es uno inventado (`deleted-<id>@account.invalid`)
        y el perfil se llama "Alumno eliminado"; es definitivo.
    LessonType:
      type: string
      enum: [INDIVIDUAL, GROUP]
    LessonStatus:
      type: string
      enum: [OPEN, FULL, CANCELLED, COMPLETED]
    BookingStatus:
      type: string
      description: >-
        Si la reserva sigue en pie y, si no, quien la termino. La asistencia NO esta aqui desde la
        Fase 9: ATTENDED y NO_SHOW sacaban la reserva de CONFIRMED y, con ello, del indice unico,
        de la restriccion de solapamiento y del recuento de plazas. Ver Attendance.
      enum: [CONFIRMED, CANCELLED_BY_STUDENT, CANCELLED_BY_TEACHER, CANCELLED_BY_ADMIN]
    Attendance:
      type: string
      enum: [PENDING, ATTENDED, NO_SHOW]
    ManagedStatus:
      type: string
      enum: [MANAGED, INACTIVE]

    UserSummary:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
      description: >
        fullName se retira hasta la Fase 6: el nombre vive en student_profiles, tabla que
        todavía no existe. Aceptar el campo y descartarlo haría creer al cliente que se ha
        guardado. Volverá cuando el módulo student pueda persistirlo.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, user]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserSummary" }

    AccessTokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 10 }

    MyDataExport:
      type: object
      required: [exportedAt, account, bookings, records, messages, photo, passes, passPurchases, memberships]
      properties:
        exportedAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/MeResponse" }
        bookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        records:
          type: array
          description: >-
            Lo que cada profesor ha escrito del alumno, notas privadas incluidas: el derecho de
            acceso cubre lo que se guarda de una persona (Fase 23).
          items:
            type: object
            required: [level, goals, privateNotes]
            properties:
              level: { type: string, nullable: true }
              goals: { type: string, nullable: true }
              privateNotes: { type: string, nullable: true }
        messages:
          type: array
          description: Los mensajes que el alumno recibio y siguen en su tablon (Fase 24).
          items: { $ref: "#/components/schemas/ReceivedMessage" }
        photo:
          type: object
          nullable: true
          description: La foto del alumno en base64, o null si no tiene (Fase 25.5).
          required: [contentType, base64]
          properties:
            contentType: { type: string }
            base64: { type: string }
        passes:
          type: array
          description: Los bonos del alumno, con su saldo (Fase 27).
          items: { $ref: "#/components/schemas/Pass" }
        passPurchases:
          type: array
          description: Los bonos que el alumno ha comprado en la app, pagados o no (Fase 27.5).
          items: { $ref: "#/components/schemas/PassPurchase" }
        memberships:
          type: array
          description: Los grupos fijos del alumno, con sus meses y lo que se apunto de ellos (Fase 28).
          items: { $ref: "#/components/schemas/Membership" }

    Level:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        position: { type: integer, minimum: 1 }

    LevelList:
      type: object
      required: [levels]
      properties:
        levels:
          type: array
          items: { $ref: "#/components/schemas/Level" }

    CreateLevelRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }

    UpdateLevelRequest:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        position: { type: integer, minimum: 1 }

    Court:
      type: object
      required: [id, name, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        position: { type: integer, minimum: 1 }

    CourtList:
      type: object
      required: [courts]
      properties:
        courts:
          type: array
          items: { $ref: "#/components/schemas/Court" }

    RenameCourtRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 60 }

    ChangeCourtRequest:
      type: object
      required: [courtId]
      properties:
        courtId: { type: string, format: uuid }

    ChangeLevelRequest:
      type: object
      properties:
        levelId: { type: string, format: uuid, nullable: true }

    StudentRecordRequest:
      type: object
      properties:
        levelId: { type: string, format: uuid, nullable: true }
        goals: { type: string, nullable: true, maxLength: 2000 }
        privateNotes: { type: string, nullable: true, maxLength: 2000 }

    EditLessonRequest:
      type: object
      properties:
        notes: { type: string, nullable: true, maxLength: 2000 }
        capacity: { type: integer, minimum: 1, nullable: true }

    CancelLessonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 200
          description: Va en el correo a los alumnos y no se guarda.

    CancelDayRequest:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date, description: "Dia en la zona horaria del profesor" }
        reason:
          type: string
          nullable: true
          maxLength: 200
          description: Va en el correo a los alumnos y no se guarda.

    CancelledDay:
      type: object
      required: [lessons]
      properties:
        lessons:
          type: array
          items: { $ref: "#/components/schemas/Lesson" }

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 10 }

    MeResponse:
      type: object
      required: [id, email, role, status, emailVerifiedAt, fullName, phone, nationalId, address, displayName, timezone, levelId, hasPhoto]
      description: >-
        Forma única para todos los roles: los campos que no aplican llegan a `null`. Un alumno
        recién verificado que aún no ha rellenado sus datos recibe `fullName`, `phone`,
        `nationalId` y `address` a `null`, y esa ausencia es la señal de que el frontend debe
        pedírselos.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        fullName: { type: string, nullable: true, description: "Solo STUDENT" }
        phone: { type: string, nullable: true }
        nationalId: { type: string, nullable: true, description: "Solo STUDENT. Dato restringido: solo visible para el propio usuario, el profesor que lo gestiona o un ADMIN" }
        address: { type: string, nullable: true, description: "Solo STUDENT. Dato restringido, igual que nationalId" }
        displayName: { type: string, nullable: true, description: "Solo TEACHER" }
        timezone: { type: string, nullable: true, description: "Solo TEACHER. Id IANA, p.ej. Europe/Madrid" }
        levelId: { type: string, format: uuid, nullable: true, description: "Solo STUDENT: el nivel que le dio su profesor (Fase 23)" }
        hasPhoto: { type: boolean, description: "Solo STUDENT: si ha subido su foto (Fase 25.5); false para los demás" }

    UpdateMeRequest:
      type: object
      description: >-
        Solo se aceptan los campos aplicables al rol del usuario autenticado. Enviar uno de
        otro rol responde `400` con código `FIELD_NOT_APPLICABLE_TO_ROLE`, en lugar de
        ignorarlo: un cambio descartado en silencio hace creer al cliente que guardó.

        El primer `PATCH` de un alumno debe llevar `fullName`, porque es cuando nace su perfil.
        Los siguientes pueden ser parciales; una cadena vacía borra un campo opcional.
      properties:
        fullName: { type: string, description: "Solo STUDENT" }
        phone: { type: string }
        nationalId: { type: string, description: "Solo STUDENT" }
        address: { type: string, description: "Solo STUDENT" }
        displayName: { type: string, description: "Solo TEACHER" }
        timezone: { type: string, description: "Solo TEACHER" }

    TeacherProfile:
      type: object
      required: [userId, displayName, phone, timezone]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        timezone: { type: string, example: "Europe/Madrid" }

    StudentSummary:
      type: object
      required: [userId, fullName, email, managedStatus, managedAt, hasPhoto]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        managedStatus: { $ref: "#/components/schemas/ManagedStatus" }
        managedAt: { type: string, format: date-time, nullable: true }
        hasPhoto: { type: boolean, description: "Si el profesor puede pedir su foto (Fase 25.5)" }

    StudentLookup:
      type: object
      required: [userId, email, fullName, managedStatus]
      description: >-
        Lo mínimo para confirmar a quién se va a asociar. Sin teléfono, DNI ni dirección.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true, description: "null si el alumno aún no ha rellenado sus datos" }
        managedStatus:
          type: string
          enum: [MANAGED, INACTIVE]
          nullable: true
          description: >-
            null cuando todavía no existe relación con este profesor. Repite los valores de
            ManagedStatus en vez de referenciarlo: en OpenAPI 3.0 un nullable junto a un $ref o
            un allOf no tiene efecto, y el null quedaba fuera del contrato.

    StudentDetail:
      type: object
      required: [userId, email, fullName, phone, nationalId, address, managedStatus, managedAt, deactivatedAt, levelId, goals, privateNotes, hasPhoto]
      description: >-
        Ficha completa de un alumno gestionado, con los datos restringidos. Nunca se devuelve
        en listados ni búsquedas.
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        nationalId: { type: string, nullable: true }
        address: { type: string, nullable: true }
        managedStatus: { $ref: "#/components/schemas/ManagedStatus" }
        managedAt: { type: string, format: date-time }
        deactivatedAt: { type: string, format: date-time, nullable: true }
        levelId: { type: string, format: uuid, nullable: true }
        goals: { type: string, nullable: true }
        privateNotes: { type: string, nullable: true, description: "No se ven en la app del alumno (Fase 23)" }
        hasPhoto: { type: boolean, description: "Si el profesor puede pedir su foto: false si lo dio de baja (Fase 25.5)" }

    StudentSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StudentSummary" }

    LocalTime:
      type: string
      description: >
        Hora de pared en la zona del profesor, sin fecha y sin desplazamiento. **Se devuelve
        siempre como `HH:mm:ss`**; a la entrada se acepta también `HH:mm`. No es un instante:
        a qué momento corresponde depende de la fecha y de la zona horaria del profesor.
      example: "09:00:00"

    DayOfWeek:
      type: string
      description: >
        Nombre ISO-8601 del día. Es un nombre y no un número a propósito: alrededor de este
        campo se cruzan tres convenciones —el borrador de este contrato decía 0 = lunes,
        `java.time.DayOfWeek` numera el lunes 1 y `EXTRACT(DOW)` de PostgreSQL numera el
        domingo 0— y un número equivocado no falla en ninguna capa: mueve el horario un día.
        Un nombre equivocado no se puede interpretar.
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    WeeklyAvailabilityRule:
      type: object
      required: [id, dayOfWeek, startTime, endTime, activeFrom, activeUntil]
      properties:
        id: { type: string, format: uuid }
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        startTime: { $ref: "#/components/schemas/LocalTime" }
        endTime: { $ref: "#/components/schemas/LocalTime" }
        activeFrom:
          type: string
          format: date
          nullable: true
          description: Null = aplica desde siempre. Ambos extremos son inclusivos.
        activeUntil: { type: string, format: date, nullable: true }

    WeeklyAvailabilityRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          description: >
            El conjunto completo. Una lista vacía es válida: significa que no hay horario
            semanal fijo.
          items:
            type: object
            required: [dayOfWeek, startTime, endTime]
            properties:
              dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
              startTime: { $ref: "#/components/schemas/LocalTime" }
              endTime: { $ref: "#/components/schemas/LocalTime" }
              activeFrom: { type: string, format: date, nullable: true }
              activeUntil: { type: string, format: date, nullable: true }

    WeeklyAvailabilityResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/WeeklyAvailabilityRule" }

    AvailabilityException:
      type: object
      required: [id, date, startTime, endTime, type]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        startTime:
          type: string
          nullable: true
          description: Null en un `BLOCK` significa el día entero. En un `EXTRA` nunca es null.
        endTime: { type: string, nullable: true }
        type: { type: string, enum: [BLOCK, EXTRA] }

    CreateAvailabilityExceptionRequest:
      type: object
      required: [date, type]
      properties:
        date: { type: string, format: date }
        startTime:
          type: string
          nullable: true
          description: >
            Obligatoria en un `EXTRA`. En un `BLOCK`, omitir las dos horas bloquea el día
            entero; enviar una sola de las dos se rechaza, porque no describe nada.
        endTime: { type: string, nullable: true }
        type: { type: string, enum: [BLOCK, EXTRA] }

    AvailabilityResponse:
      type: object
      required: [weeklyRules, exceptions]
      properties:
        weeklyRules:
          type: array
          items: { $ref: "#/components/schemas/WeeklyAvailabilityRule" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityException" }

    Calendar:
      type: object
      required: [timezone, availability, lessons]
      properties:
        timezone: { type: string, nullable: true, description: "Zona IANA del profesor; null si el alumno no esta gestionado" }
        availability:
          type: array
          items:
            type: object
            required: [startsAt, endsAt]
            properties:
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
        lessons:
          type: array
          items:
            type: object
            required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status, levelId, courtId, myBooking]
            properties:
              id: { type: string, format: uuid }
              teacherUserId: { type: string, format: uuid }
              type: { $ref: "#/components/schemas/LessonType" }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              capacity: { type: integer }
              bookedCount: { type: integer }
              status: { $ref: "#/components/schemas/LessonStatus" }
              levelId: { type: string, format: uuid, nullable: true, description: "Nivel de la clase (Fase 23); null, abierta a todos" }
              courtId: { type: string, format: uuid, description: "La pista de la clase (Fase 25.6)" }
              myBooking:
                type: object
                required: [id, status, attendance]
                nullable: true
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/BookingStatus" }
                  attendance: { $ref: "#/components/schemas/Attendance" }

    CreateLessonRequest:
      type: object
      required: [type, startsAt, endsAt, capacity]
      properties:
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity:
          type: integer
          minimum: 1
          description: >-
            Una clase INDIVIDUAL tiene capacidad exactamente 1. Una GROUP va de 1 hasta el tope
            configurado en platform_configuration.max_group_capacity, 8 por defecto.
        notes: { type: string, nullable: true }
        overrideAvailability:
          type: boolean
          default: false
          description: Permite crear la clase fuera de la disponibilidad configurada
        levelId: { type: string, format: uuid, nullable: true, description: "El nivel de la clase; sin el, abierta a todos" }
        courtId: { type: string, format: uuid, nullable: true, description: "La pista; sin ella, la primera (Fase 25.6)" }

    SeriesPreviewRequest:
      type: object
      required: [type, startsAt, endsAt, capacity, weeks]
      properties:
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time, description: La primera clase de la serie }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        notes: { type: string, nullable: true }
        weeks: { type: integer, minimum: 2, maximum: 16, description: Contando la primera }
        levelId: { type: string, format: uuid, nullable: true }
        courtId: { type: string, format: uuid, nullable: true, description: "La pista de toda la serie; sin ella, la primera" }

    SeriesPreview:
      type: object
      required: [occurrences]
      properties:
        occurrences:
          type: array
          items:
            type: object
            required: [startsAt, endsAt, status]
            properties:
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              status: { type: string, enum: [OK, OUTSIDE_AVAILABILITY, OVERLAP, IN_THE_PAST] }

    CreateSeriesRequest:
      allOf:
        - $ref: "#/components/schemas/SeriesPreviewRequest"
        - type: object
          required: [dates]
          properties:
            dates:
              type: array
              minItems: 1
              items: { type: string, format: date-time }
              description: El inicio de cada fecha elegida, tal como lo dio la vista previa
            overrideAvailability: { type: boolean, default: false }

    LessonList:
      type: object
      required: [lessons]
      properties:
        lessons:
          type: array
          items: { $ref: "#/components/schemas/Lesson" }

    Lesson:
      type: object
      required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status, notes, createdOutsideAvailability, cancelledAt, cancelledAtShortNotice, seriesId, seriesPosition, seriesSize, levelId, courtId]
      description: >-
        bookedCount es el numero de reservas confirmadas. Se retiro en la Fase 8, cuando solo
        booking podia contarlas y aun no existia, y volvio con la Fase 9.

        status se calcula al leer y no se guarda. La columna solo tiene OPEN y CANCELLED, que es
        lo que decide una persona; COMPLETED se deduce del reloj y FULL del numero de reservas.
        Precedencia: CANCELLED, luego COMPLETED, luego FULL, luego OPEN. Una clase llena que ya
        termino es COMPLETED: de una clase pasada lo que importa es que ocurrio.

        notes es del profesor. Viaja como null para cualquier otro llamante: es texto libre que
        el profesor escribe para si mismo, no para que lo lea el alumno.
      properties:
        id: { type: string, format: uuid }
        teacherUserId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer }
        bookedCount: { type: integer }
        status: { $ref: "#/components/schemas/LessonStatus" }
        notes: { type: string, nullable: true }
        createdOutsideAvailability: { type: boolean }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledAtShortNotice:
          type: boolean
          description: Si la cancelacion dejo menos de 24 horas. Derivado de cancelledAt y startsAt.
        seriesId:
          type: string
          format: uuid
          nullable: true
          description: La serie semanal en la que se creo (Fase 22), o null si se creo suelta
        seriesPosition:
          type: integer
          nullable: true
          description: Su puesto en la serie («3 de 12»). Solo al leer una clase; null en las listas
        seriesSize: { type: integer, nullable: true }
        levelId: { type: string, format: uuid, nullable: true, description: "Nivel de la clase (Fase 23); null, abierta a todos" }
        courtId: { type: string, format: uuid, description: "La pista de la clase (Fase 25.6)" }

    Booking:
      type: object
      required: [id, lessonId, studentUserId, status, attendance, bookedAt, cancelledAt, lesson, passId, membershipId]
      description: >-
        lesson viaja sin notes para todos: las notas son del profesor y se leen en la propia
        clase, donde se decide quien las ve. Repetir esa regla aqui seria una segunda copia.
        passId es el bono con el que se pago (Fase 27), o null si no hacia falta. membershipId es
        el grupo fijo cuya cuota paga la plaza (Fase 28), o null si es una reserva suelta.
      properties:
        id: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        studentUserId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        attendance: { $ref: "#/components/schemas/Attendance" }
        bookedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        lesson: { $ref: "#/components/schemas/LessonSummary" }
        passId: { type: string, format: uuid, nullable: true }
        membershipId: { type: string, format: uuid, nullable: true }

    LessonSummary:
      type: object
      description: La clase tal como viaja dentro de una reserva o de una lista de espera, sin notes.
      required: [id, teacherUserId, type, startsAt, endsAt, capacity, bookedCount, status, courtId]
      properties:
        id: { type: string, format: uuid }
        teacherUserId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/LessonType" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        capacity: { type: integer }
        bookedCount: { type: integer }
        status: { $ref: "#/components/schemas/LessonStatus" }
        courtId: { type: string, format: uuid, description: "La pista de la clase (Fase 25.6)" }

    WaitingPlace:
      type: object
      description: >-
        Un puesto en la lista de espera de una clase llena. position cuenta desde 1: el primero
        es el siguiente en recibir plaza.
      required: [lesson, position, joinedAt]
      properties:
        lesson: { $ref: "#/components/schemas/LessonSummary" }
        position: { type: integer, minimum: 1 }
        joinedAt: { type: string, format: date-time }

    WaitingPlaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WaitingPlace" }

    WaitingStudentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [studentUserId, position, joinedAt]
            properties:
              studentUserId: { type: string, format: uuid }
              position: { type: integer, minimum: 1 }
              joinedAt: { type: string, format: date-time }

    BookingPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Booking" }

    MarkAttendanceRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [bookingId, status]
            properties:
              bookingId: { type: string, format: uuid }
              status: { type: string, enum: [ATTENDED, NO_SHOW] }

    MessageAudience:
      type: string
      enum: [ALL, LEVEL, LESSON, SERIES]

    SendMessageRequest:
      type: object
      required: [audience, subject, body]
      description: levelId solo con LEVEL, lessonId solo con LESSON y SERIES.
      properties:
        audience: { $ref: "#/components/schemas/MessageAudience" }
        levelId: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        subject: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 4000 }

    SentMessage:
      type: object
      required: [id, audience, audienceLabel, subject, body, sentAt, recipientCount]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/MessageAudience" }
        audienceLabel:
          type: string
          description: >-
            A quien fue, escrito al enviar ("Nivel Intermedio", "Clase del lunes 2 de noviembre,
            18:00"): el nivel o la clase pueden cambiar o desaparecer despues.
        subject: { type: string }
        body: { type: string }
        sentAt: { type: string, format: date-time }
        recipientCount: { type: integer, minimum: 1 }

    SentMessagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SentMessage" }

    ReceivedMessage:
      type: object
      required: [id, subject, body, sentAt]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        body: { type: string }
        sentAt: { type: string, format: date-time }

    ReceivedMessagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ReceivedMessage" }

    MonthFigures:
      type: object
      description: >-
        Los numeros de un mes. La ocupacion es seatsTaken / seatsOffered y la asistencia
        attended / (attended + noShow); unmarked son las plazas sin pasar lista.
      required: [lessonsGiven, individualLessons, groupLessons, seatsOffered, seatsTaken, attended, noShow,
        unmarked, activeStudents, cancelledLessons, cancelledAtShortNotice]
      properties:
        lessonsGiven: { type: integer }
        individualLessons: { type: integer }
        groupLessons: { type: integer }
        seatsOffered: { type: integer }
        seatsTaken: { type: integer }
        attended: { type: integer }
        noShow: { type: integer }
        unmarked: { type: integer }
        activeStudents: { type: integer }
        cancelledLessons: { type: integer }
        cancelledAtShortNotice: { type: integer }

    MonthSummary:
      type: object
      required: [month, timezone, current, previous, levels, sales, previousSales, fees, previousFees]
      properties:
        month: { type: string, example: "2026-10" }
        timezone: { type: string, example: Europe/Madrid }
        current: { $ref: "#/components/schemas/MonthFigures" }
        previous: { $ref: "#/components/schemas/MonthFigures" }
        levels:
          type: array
          description: >-
            Una fila por nivel con clases en alguno de los dos meses; levelId null son las abiertas
            a todos. Un alumno con clases de dos niveles es activo en las dos filas.
          items:
            type: object
            required: [levelId, current, previous]
            properties:
              levelId: { type: string, format: uuid, nullable: true }
              current: { $ref: "#/components/schemas/MonthFigures" }
              previous: { $ref: "#/components/schemas/MonthFigures" }
        sales: { $ref: "#/components/schemas/PassSales" }
        previousSales: { $ref: "#/components/schemas/PassSales" }
        fees: { $ref: "#/components/schemas/FeeIncome" }
        previousFees: { $ref: "#/components/schemas/FeeIncome" }

    PassSales:
      type: object
      description: >-
        Los bonos vendidos en el mes, por el dia en que se pagaron y sin los anulados, y lo que
        suman en centimos (Fase 27). Es lo unico de dinero que sabe la app.
      required: [passesSold, totalCents]
      properties:
        passesSold: { type: integer }
        totalCents: { type: integer, format: int64 }

    PassType:
      type: object
      required: [id, name, lessonType, lessons, priceCents, validityMonths, retired]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        lessonType: { $ref: "#/components/schemas/LessonType" }
        lessons: { type: integer, minimum: 1, maximum: 200 }
        priceCents: { type: integer, minimum: 0 }
        validityMonths:
          type: integer
          minimum: 1
          maximum: 36
          nullable: true
          description: Meses desde el dia del pago; null si no caduca.
        retired: { type: boolean }

    PassTypeList:
      type: object
      required: [required, onlinePayment, onlinePaymentAvailable, passTypes]
      properties:
        required: { type: boolean, description: 'Si el profesor ha encendido "sin bono no se reserva"' }
        onlinePayment: { type: boolean, description: Si el profesor vende los bonos en la app (Fase 27.5) }
        onlinePaymentAvailable:
          type: boolean
          description: Si el servidor tiene las claves de la pasarela; sin ellas no se puede encender onlinePayment
        passTypes:
          type: array
          items: { $ref: "#/components/schemas/PassType" }

    CreatePassTypeRequest:
      type: object
      required: [name, lessonType, lessons, priceCents]
      properties:
        name: { type: string, maxLength: 60 }
        lessonType: { $ref: "#/components/schemas/LessonType" }
        lessons: { type: integer, minimum: 1, maximum: 200 }
        priceCents: { type: integer, minimum: 0 }
        validityMonths: { type: integer, minimum: 1, maximum: 36, nullable: true }

    UpdatePassTypeRequest:
      type: object
      description: Todos opcionales. neverExpires true quita la caducidad.
      properties:
        name: { type: string, maxLength: 60 }
        lessonType: { $ref: "#/components/schemas/LessonType" }
        lessons: { type: integer, minimum: 1, maximum: 200 }
        priceCents: { type: integer, minimum: 0 }
        validityMonths: { type: integer, minimum: 1, maximum: 36 }
        neverExpires: { type: boolean }
        retired: { type: boolean }

    PassSettingsRequest:
      type: object
      description: Los dos opcionales; el que no se manda conserva su valor.
      properties:
        required: { type: boolean }
        onlinePayment: { type: boolean }

    PassSettings:
      type: object
      required: [required, onlinePayment, onlinePaymentAvailable]
      properties:
        required: { type: boolean }
        onlinePayment: { type: boolean }
        onlinePaymentAvailable: { type: boolean }

    PaymentMethod:
      type: string
      description: >-
        ONLINE lo pone la app cuando la pasarela confirma una compra (Fase 27.5); el profesor solo
        apunta CASH, BIZUM o TRANSFER.
      enum: [CASH, BIZUM, TRANSFER, ONLINE]

    StartPurchaseRequest:
      type: object
      required: [passTypeId]
      properties:
        passTypeId: { type: string, format: uuid }

    PurchaseStatus:
      type: string
      description: PENDING hasta que la pasarela avisa; PAID con su bono; EXPIRED si se abandono el pago.
      enum: [PENDING, PAID, EXPIRED]

    PassPurchase:
      type: object
      description: >-
        Una compra de bono en la app (Fase 27.5). Copia el tipo al empezar. checkoutUrl solo
        mientras esta PENDING; passId, el bono que salio, cuando esta PAID.
      required: [id, passTypeId, name, lessonType, lessons, priceCents, validityMonths, status, checkoutUrl,
                 passId, createdAt, expiresAt, paidAt]
      properties:
        id: { type: string, format: uuid }
        passTypeId: { type: string, format: uuid }
        name: { type: string }
        lessonType: { $ref: "#/components/schemas/LessonType" }
        lessons: { type: integer }
        priceCents: { type: integer }
        validityMonths: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/PurchaseStatus" }
        checkoutUrl: { type: string, nullable: true }
        passId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }

    PassStatus:
      type: string
      description: >-
        Se calcula al leer: USED_UP sin clases, EXPIRED pasado su ultimo dia, VOIDED anulado.
      enum: [ACTIVE, USED_UP, EXPIRED, VOIDED]

    Pass:
      type: object
      description: >-
        Un bono de un alumno (Fase 27). used son sus reservas confirmadas, incluidas aquellas a las
        que no vino: la clase se gasta al reservar. Una reserva cancelada devuelve la clase a este
        bono, aunque ya haya caducado. validUntil es el ultimo dia en que paga una clase.
      required: [id, studentUserId, passTypeId, name, lessonType, lessons, used, remaining, priceCents,
                 paidOn, paymentMethod, validUntil, status, createdAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        studentUserId: { type: string, format: uuid }
        passTypeId: { type: string, format: uuid }
        name: { type: string }
        lessonType: { $ref: "#/components/schemas/LessonType" }
        lessons: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        priceCents: { type: integer }
        paidOn: { type: string, format: date }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        validUntil: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/PassStatus" }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }

    PassList:
      type: object
      required: [required, items]
      properties:
        required: { type: boolean, description: 'Si el profesor ha encendido "sin bono no se reserva"' }
        items:
          type: array
          items: { $ref: "#/components/schemas/Pass" }

    RecordPassRequest:
      type: object
      required: [passTypeId, paidOn, paymentMethod]
      properties:
        passTypeId: { type: string, format: uuid }
        paidOn: { type: string, format: date }
        paymentMethod:
          type: string
          description: ONLINE no se apunta a mano; lo pone la app (Fase 27.5).
          enum: [CASH, BIZUM, TRANSFER]

    FixedGroup:
      type: object
      description: >-
        Un grupo fijo (Fase 28), calculado de sus series al leer. levelId es el nivel de su proxima
        clase; freeSeats, cuantos mas cabrian en todas las clases que quedan (null si no queda
        ninguna). members solo lo rellena el profesor.
      required: [id, name, monthlyFeeCents, series, levelId, freeSeats, memberCount, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        monthlyFeeCents: { type: integer, minimum: 0 }
        series:
          type: array
          items: { $ref: "#/components/schemas/GroupSeries" }
        levelId: { type: string, format: uuid, nullable: true }
        freeSeats: { type: integer, nullable: true }
        memberCount: { type: integer }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }

    GroupSeries:
      type: object
      description: Una serie del grupo, su proxima clase (null si ya no queda) y cuantas quedan.
      required: [seriesId, lessonType, nextStartsAt, nextEndsAt, upcomingLessons]
      properties:
        seriesId: { type: string, format: uuid }
        lessonType:
          type: string
          nullable: true
          enum: [INDIVIDUAL, GROUP]
        nextStartsAt: { type: string, format: date-time, nullable: true }
        nextEndsAt: { type: string, format: date-time, nullable: true }
        upcomingLessons: { type: integer }

    GroupMember:
      type: object
      description: leftAt en el futuro es una baja que llega a fin de mes.
      required: [membershipId, studentUserId, joinedAt, leftAt]
      properties:
        membershipId: { type: string, format: uuid }
        studentUserId: { type: string, format: uuid }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }

    FixedGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FixedGroup" }

    CreateGroupRequest:
      type: object
      required: [name, monthlyFeeCents]
      properties:
        name: { type: string, maxLength: 60 }
        monthlyFeeCents: { type: integer, minimum: 0, maximum: 1000000 }

    UpdateGroupRequest:
      type: object
      description: Los dos opcionales.
      properties:
        name: { type: string, maxLength: 60 }
        monthlyFeeCents: { type: integer, minimum: 0, maximum: 1000000 }

    AttachSeriesRequest:
      type: object
      required: [seriesId]
      properties:
        seriesId: { type: string, format: uuid }

    AddMemberRequest:
      type: object
      required: [studentUserId]
      properties:
        studentUserId: { type: string, format: uuid }

    FeeStatus:
      type: string
      description: PAID y WAIVED se apuntan; PENDING y OVERDUE se calculan al leer.
      enum: [PAID, WAIVED, PENDING, OVERDUE]

    Fee:
      type: object
      description: Lo que el profesor apunto de un mes. WAIVED es "no se cobra".
      required: [id, membershipId, month, kind, amountCents, paidOn, paymentMethod, recordedAt, voidedAt]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        month: { type: string, example: "2026-11" }
        kind: { type: string, enum: [PAID, WAIVED] }
        amountCents: { type: integer }
        paidOn: { type: string, format: date, nullable: true }
        paymentMethod:
          type: string
          nullable: true
          enum: [CASH, BIZUM, TRANSFER]
        recordedAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }

    FeeLine:
      type: object
      description: >-
        Un mes de un apuntado. dueOn es el ultimo dia para pagarlo; monthlyFeeCents, la cuota que
        tiene hoy el grupo; fee, lo apuntado, o null.
      required: [membershipId, groupId, groupName, studentUserId, month, dueOn, status, monthlyFeeCents, fee]
      properties:
        membershipId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        studentUserId: { type: string, format: uuid }
        month: { type: string, example: "2026-11" }
        dueOn: { type: string, format: date }
        status: { $ref: "#/components/schemas/FeeStatus" }
        monthlyFeeCents: { type: integer }
        fee:
          type: object
          nullable: true
          description: >-
            El Fee apuntado, repetido aqui en vez de referenciado: en OpenAPI 3.0 un nullable junto
            a un $ref no tiene efecto.
          required: [id, membershipId, month, kind, amountCents, paidOn, paymentMethod, recordedAt, voidedAt]
          properties:
            id: { type: string, format: uuid }
            membershipId: { type: string, format: uuid }
            month: { type: string }
            kind: { type: string, enum: [PAID, WAIVED] }
            amountCents: { type: integer }
            paidOn: { type: string, format: date, nullable: true }
            paymentMethod:
              type: string
              nullable: true
              enum: [CASH, BIZUM, TRANSFER]
            recordedAt: { type: string, format: date-time }
            voidedAt: { type: string, format: date-time, nullable: true }

    FeeLineList:
      type: object
      required: [dueDay, items]
      properties:
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        items:
          type: array
          items: { $ref: "#/components/schemas/FeeLine" }

    RecordFeeRequest:
      type: object
      required: [membershipId, month, kind]
      properties:
        membershipId: { type: string, format: uuid }
        month: { type: string, example: "2026-11" }
        kind: { type: string, enum: [PAID, WAIVED] }
        amountCents: { type: integer, minimum: 0, maximum: 1000000 }
        paidOn: { type: string, format: date }
        paymentMethod: { type: string, enum: [CASH, BIZUM, TRANSFER] }

    FeeSettings:
      type: object
      required: [dueDay]
      properties:
        dueDay: { type: integer, minimum: 1, maximum: 28 }

    Membership:
      type: object
      description: >-
        El sitio de un alumno en un grupo, con sus meses hasta el actual y los apuntados por
        adelantado. leftAt en el futuro es una baja que llega a fin de mes.
      required: [id, group, joinedAt, leftAt, fees]
      properties:
        id: { type: string, format: uuid }
        group: { $ref: "#/components/schemas/FixedGroup" }
        joinedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
        fees:
          type: array
          items: { $ref: "#/components/schemas/FeeLine" }

    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    FeeIncome:
      type: object
      description: >-
        Las cuotas cobradas en el mes, por el dia en que se pagaron y sin las anuladas, y lo que
        suman en centimos (Fase 28).
      required: [feesPaid, totalCents]
      properties:
        feesPaid: { type: integer }
        totalCents: { type: integer, format: int64 }

    PlatformConfiguration:
      type: object
      required: [studentLimit, maxGroupCapacity, updatedAt, updatedBy]
      properties:
        studentLimit: { type: integer }
        maxGroupCapacity:
          type: integer
          description: >-
            Tope de plazas de una clase grupal, anadido en la Fase 8. Configurable y no una
            constante del codigo: el dia que el numero este mal, lo estara para todas las clases
            a la vez.
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid, nullable: true }

    UpdateConfigurationRequest:
      type: object
      properties:
        studentLimit: { type: integer, minimum: 1 }
        maxGroupCapacity: { type: integer, minimum: 1 }

    AdminUserSummary:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }

    AdminUserSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminUserSummary" }

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }

    Page:
      type: object
      required: [page, size, totalItems]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
