name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment: a tag can be moved to
# other code, a SHA cannot. Dependabot still proposes the updates, SHA and comment included.

jobs:
  backend:
    name: Backend build, tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp/backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify, not test: this single command is also what runs Spotless (validate),
      # SpotBugs (verify) and JaCoCo, so the pipeline and a developer's machine run
      # exactly the same thing.
      - name: Build, test and analyse
        run: mvn -B verify

      # The criterion of Fase 5.1. During Fase 4 the suite reported BUILD SUCCESS while
      # five of eight tests skipped, because Testcontainers could not reach Docker. A
      # skipped integration test is a test that proves nothing, so it fails the build here.
      - name: Fail if any test was skipped
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          reports = glob.glob('target/surefire-reports/TEST-*.xml')
          if not reports:
              sys.exit('No surefire reports found: the test suite did not run at all.')

          total = skipped = failures = 0
          skipped_names = []
          for report in reports:
              suite = ET.parse(report).getroot()
              total += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              count = int(suite.get('skipped', 0))
              skipped += count
              if count:
                  skipped_names.append(suite.get('name'))

          print(f'tests={total} failures={failures} skipped={skipped}')
          if skipped:
              print('Skipped in: ' + ', '.join(skipped_names))
              sys.exit('Integration tests that skip look green and prove nothing. '
                       'Check that Docker is reachable from the runner.')
          PY

      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            TennisPlatformApp/backend/target/surefire-reports/
            TennisPlatformApp/backend/target/site/jacoco/
            TennisPlatformApp/backend/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp/frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TennisPlatformApp/frontend/package-lock.json

      - run: npm ci

      # Only what ships to the browser; the dev tooling never runs in production.
      - name: No known vulnerable dependency
        run: npm audit --omit=dev --audit-level=high

      # The types are generated from openapi.yaml and committed. A contract change without
      # regenerating them - or a hand edit of the generated file - fails here.
      - name: API types match openapi.yaml
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts

      # The lint includes the module boundaries (eslint.config.mjs), the frontend's ArchUnit.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-image:
    name: Stack starts and the end-to-end flows pass
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp
    # What compose passes to the backend, and what the E2E suite signs in with. Throwaway
    # values for a stack that lives as long as the job.
    env:
      TEACHER_EMAIL: teacher@e2e.local
      TEACHER_PASSWORD: e2e-teacher-password
      TEACHER_DISPLAY_NAME: Profesora E2E
      ADMIN_EMAIL: admin@e2e.local
      ADMIN_PASSWORD: e2e-admin-password
      # The whole suite comes from one IP (25-fase14-analisis-cobertura-e2e.md).
      AUTH_RATE_LIMIT_PER_MINUTE: 1000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately no push to a registry: there is no deployment target yet
      # (02-arquitectura.md defers the provider), so published images would be
      # inventory nobody consumes. What must not regress is that the image builds and
      # the application actually starts against a real database with Liquibase applied.
      - name: Build the image and start the stack
        run: docker compose up -d --build

      # Scans what actually ships: the JRE, Alpine and every jar inside the image. Only
      # vulnerabilities that already have a fixed version fail the build, since those are
      # the ones there is something to do about. Dependabot cannot see this: it does not
      # bump what the Spring Boot BOM manages (26-fase15-analisis-seguridad.md).
      - name: No known fixable vulnerability in the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 tennis-platform-backend:latest

      - name: Wait until the backend reports healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tennis-backend 2>/dev/null || echo missing)
            echo "health=$status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          echo '::error::The backend never became healthy'
          exit 1

      - name: Check the health endpoint from outside the container
        run: curl --fail --silent --show-error http://localhost:8080/actuator/health

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TennisPlatformApp/frontend/package-lock.json

      - name: Install the frontend and Chromium
        working-directory: TennisPlatformApp/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright builds and starts the frontend itself (playwright.config.ts), no retries.
      - name: End-to-end flows
        working-directory: TennisPlatformApp/frontend
        run: npm run e2e

      # Same rule as the backend: a skipped flow looks green and proves nothing.
      - name: Fail if any end-to-end test was skipped
        if: always()
        working-directory: TennisPlatformApp/frontend
        run: |
          node -e '
            const { stats } = require("./test-results/results.json");
            console.log(stats);
            if (stats.skipped > 0) process.exit(1);
          '

      - name: Publish the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            TennisPlatformApp/frontend/playwright-report/
            TennisPlatformApp/frontend/test-results/
          retention-days: 14

      - name: Dump logs when something went wrong
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
