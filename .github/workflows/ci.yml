name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, tests and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp/backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify, not test: this single command is also what runs Spotless (validate),
      # SpotBugs (verify) and JaCoCo, so the pipeline and a developer's machine run
      # exactly the same thing.
      - name: Build, test and analyse
        run: mvn -B verify

      # The criterion of Fase 5.1. During Fase 4 the suite reported BUILD SUCCESS while
      # five of eight tests skipped, because Testcontainers could not reach Docker. A
      # skipped integration test is a test that proves nothing, so it fails the build here.
      - name: Fail if any test was skipped
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          reports = glob.glob('target/surefire-reports/TEST-*.xml')
          if not reports:
              sys.exit('No surefire reports found: the test suite did not run at all.')

          total = skipped = failures = 0
          skipped_names = []
          for report in reports:
              suite = ET.parse(report).getroot()
              total += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              count = int(suite.get('skipped', 0))
              skipped += count
              if count:
                  skipped_names.append(suite.get('name'))

          print(f'tests={total} failures={failures} skipped={skipped}')
          if skipped:
              print('Skipped in: ' + ', '.join(skipped_names))
              sys.exit('Integration tests that skip look green and prove nothing. '
                       'Check that Docker is reachable from the runner.')
          PY

      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            TennisPlatformApp/backend/target/surefire-reports/
            TennisPlatformApp/backend/target/site/jacoco/
            TennisPlatformApp/backend/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TennisPlatformApp/frontend/package-lock.json

      - run: npm ci

      # The types are generated from openapi.yaml and committed. A contract change without
      # regenerating them - or a hand edit of the generated file - fails here.
      - name: API types match openapi.yaml
        run: |
          npm run api:types
          git diff --exit-code -- src/shared/api/schema.d.ts

      # The lint includes the module boundaries (eslint.config.mjs), the frontend's ArchUnit.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-image:
    name: Image builds and the stack starts
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TennisPlatformApp

    steps:
      - uses: actions/checkout@v7

      # Deliberately no push to a registry: there is no deployment target yet
      # (02-arquitectura.md defers the provider), so published images would be
      # inventory nobody consumes. What must not regress is that the image builds and
      # the application actually starts against a real database with Liquibase applied.
      - name: Build the image and start the stack
        run: docker compose up -d --build

      - name: Wait until the backend reports healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tennis-backend 2>/dev/null || echo missing)
            echo "health=$status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 5
          done
          echo '::error::The backend never became healthy'
          exit 1

      - name: Check the health endpoint from outside the container
        run: curl --fail --silent --show-error http://localhost:8080/actuator/health

      - name: Dump logs when something went wrong
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down -v
