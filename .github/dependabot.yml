version: 2

# Dependency checking is deliberately Dependabot rather than OWASP Dependency-Check: the
# latter needs an NVD API key and adds minutes to every build, while this reports the same
# vulnerable dependencies out of band without slowing the pipeline down.
#
# Major upgrades are NOT proposed automatically. On 18/09/2026 an automatic PR raised Spring
# Boot from 3.3.5 to 4.1.1; it brought Spring Security 7, removed APIs the security
# configuration depends on, and broke main. Branch protection cannot prevent a red merge on a
# private repository under the Free plan, so the defence has to be not to open that PR in the
# first place. A major upgrade is a decision with its own branch and analysis, never a merge.
updates:

  - package-ecosystem: maven
    directory: /TennisPlatformApp/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # One PR per week with the routine bumps, which CI can validate on its own.
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  # Same policy as the backend: a major of Next or React is a decision, not a merge.
  - package-ecosystem: npm
    directory: /TennisPlatformApp/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Majors are allowed here on purpose, unlike everywhere else: an action's major version is
  # how GitHub retires runner images, the blast radius is the pipeline itself, and the PR's
  # own CI run is a complete test of the change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch, major]

  # The build and runtime images. A major here means a new JDK: it changes what the
  # application runs on, so it is decided, not merged.
  - package-ecosystem: docker
    directory: /TennisPlatformApp/backend
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The maven image slips through the rule above, and PR #10 proved it: its tag is
      # 3.9-eclipse-temurin-21, so Dependabot reads the version as 3.9 -> 3 - not a major -
      # while the JDK it carries travels in the suffix, 21 -> 24. Ignoring the image by name
      # is the only thing that holds. It costs little: this image only builds the jar and is
      # never shipped, so its own patches never reach a running system, and the JDK is changed
      # by hand the day we decide to change it.
      #
      # eclipse-temurin, the runtime image, is NOT listed here: its tag is 21-jre-alpine, the
      # version reads as 21 -> 24, the rule above classifies that as a major and stops it,
      # while patch updates of the JDK that does run in production still arrive.
      - dependency-name: "maven"

  # postgres and mailpit images. A major means a new PostgreSQL engine, with its own upgrade
  # path for the data - never an automatic bump.
  - package-ecosystem: docker-compose
    directory: /TennisPlatformApp
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
